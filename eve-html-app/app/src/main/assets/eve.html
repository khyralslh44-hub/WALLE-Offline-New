let nativeSpeechOn=false;
window.eveNativeSpeechResult=function(text){try{if(text&&typeof Eve!=='undefined')Eve.speech(text)}catch(e){}};
window.eveSpeechStatus=function(message){$('note').textContent=message||'';if(message&&message.includes('تستمع')){$('bMic').classList.add('on');$('bMic').textContent='إيقاف الاستماع'}else if(message&&message.includes('توقف')){$('bMic').classList.remove('on');$('bMic').textContent='الأذن'}};
$('bMic').onclick=()=>{if(NAT&&Android.startSpeech){if(nativeSpeechOn){nativeSpeechOn=false;Android.stopSpeech();$('bMic').classList.remove('on');$('bMic').textContent='الأذن'}else{nativeSpeechOn=true;M.cfg.mic=true;save();$('bMic').textContent='جارٍ تشغيل الأذن...';Android.startSpeech()}}else micToggle()};
$('bVox').onclick=()=>{voice=!voice;$('bVox').classList.toggle('on',voice);if(!voice)try{speechSynthesis.cancel()}catch(e){}};
$('wipe').onclick=()=>{if(confirm('مسح كل ما تعلّمته إيف؟')){try{localStorage.removeItem('eve1')}catch(e){}location.reload()}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)bump('joy',.5)});
$('llm').textContent='العقل: شبكة عصبية خاصة مدمجة بلا نماذج جاهزة ولا إنترنت'+(ELM.ready?' · نموذج إيف اللغوي: '+Math.round((ELM.V*ELM.E*2+ELM.E*3*ELM.H+ELM.H*3*ELM.H+ELM.H*ELM.E)/1000)+' ألف معامل':'');
if(navigator.getBattery)navigator.getBattery().then(b=>{window._bat=b});
setTimeout(()=>{if(!BR.booting)chirp('curious')},900);if(!NAT)setTimeout(()=>{if(!camOn)camToggle()},700);


</script></body></html>
