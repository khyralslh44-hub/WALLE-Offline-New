name: EVE Moonshine Arabic Candidate Validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/fetch-moonshine-arabic-candidate.sh'
      - '.github/scripts/validate-moonshine-arabic-onnx.py'
      - '.github/workflows/eve-moonshine-arabic-candidate.yml'
      - 'docs/ARABIC_ASR_PROTOTYPE.md'

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ONNX Runtime CPU validator
        run: python -m pip install --disable-pip-version-check onnxruntime
      - name: Fetch immutable Moonshine Arabic model snapshot and validate graphs
        shell: bash
        run: bash .github/scripts/fetch-moonshine-arabic-candidate.sh "$RUNNER_TEMP/eve-moonshine-arabic"
      - name: Upload candidate snapshot manifest
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Moonshine-Arabic-Candidate-Manifest
          path: |
            ${{ runner.temp }}/eve-moonshine-arabic/revision.txt
            ${{ runner.temp }}/eve-moonshine-arabic/*.json
          if-no-files-found: error
          retention-days: 14
