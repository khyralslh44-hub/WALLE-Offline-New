name: Submit EVE from-scratch training to Kaggle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/submit-eve-training-to-kaggle.yml"

permissions:
  contents: read

jobs:
  submit-kaggle-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EVE project
        uses: actions/checkout@v4
        with:
          ref: eve-companion-core-smoothness

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle==2.2.5"

      - name: Write Kaggle credentials securely
        env:
          KAGGLE_CREDENTIAL: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("KAGGLE_CREDENTIAL", "").strip()
          if not raw:
              raise SystemExit("Missing repository secret KAGGLE_API_TOKEN.")

          config_dir = Path.home() / ".kaggle"
          config_dir.mkdir(mode=0o700, parents=True, exist_ok=True)
          os.chmod(config_dir, 0o700)

          if raw.startswith("KGAT_"):
              token_file = config_dir / "access_token"
              token_file.write_text(raw, encoding="ascii")
              os.chmod(token_file, 0o600)
              print("Saved Kaggle personal access token to the CLI access_token file; value hidden.")
          else:
              try:
                  parsed = json.loads(raw)
              except json.JSONDecodeError:
                  parsed = None

              if isinstance(parsed, dict):
                  username = str(parsed.get("username", "conangg")).strip()
                  key = str(parsed.get("key", "")).strip()
              else:
                  username = "conangg"
                  key = raw

              if not username or not key:
                  raise SystemExit("Credential is neither a KGAT_ token nor valid kaggle.json/API key content.")

              legacy_file = config_dir / "kaggle.json"
              legacy_file.write_text(
                  json.dumps({"username": username, "key": key}),
                  encoding="utf-8"
              )
              os.chmod(legacy_file, 0o600)
              print("Saved legacy Kaggle API credentials to kaggle.json; values hidden.")
          PY

      - name: Verify Kaggle authentication
        run: |
          if ! kaggle kernels list --mine --page-size 1 > /tmp/kaggle-auth-check.log 2>&1; then
            cat /tmp/kaggle-auth-check.log
            echo "::error::Kaggle rejected the credential saved in the repository secret. Generate a fresh API token in Kaggle Settings > API and replace KAGGLE_API_TOKEN with the complete value."
            exit 1
          fi
          echo "Kaggle authentication succeeded."

      - name: Create Kaggle kernel metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          username = "conangg"
          folder = Path("eve-model/notebooks")
          notebook = folder / "kaggle_train_eve.ipynb"
          if not notebook.is_file():
              raise SystemExit(f"Notebook file not found: {notebook}")

          metadata = {
              "id": f"{username}/eve-ar-95m-training",
              "title": "EVE AR 95M Training",
              "code_file": "kaggle_train_eve.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          (folder / "kernel-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print("Prepared private EVE training notebook for Kaggle user:", username)
          PY

      - name: Submit notebook and request Kaggle GPU run
        run: |
          kaggle kernels push -p eve-model/notebooks --accelerator NvidiaTeslaT4 --timeout 43200

      - name: Print Kaggle notebook link
        run: |
          echo "Kaggle notebook: https://www.kaggle.com/code/conangg/eve-ar-95m-training"
          echo "Submission accepted by Kaggle CLI. Confirm GPU startup and training in the Kaggle notebook logs."
