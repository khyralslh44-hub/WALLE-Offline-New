name: Submit EVE from-scratch training to Kaggle

on:
  workflow_dispatch:
    inputs:
      kaggle_username:
        description: "Your Kaggle username (not your email address)"
        required: true
        default: "conangg"
        type: string

permissions:
  contents: read

jobs:
  submit-kaggle-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EVE project
        uses: actions/checkout@v4
        with:
          ref: eve-companion-core-smoothness

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle

      - name: Validate Kaggle token is configured
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Missing repository secret KAGGLE_API_TOKEN. Add your Kaggle API token in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Create Kaggle kernel metadata
        env:
          KAGGLE_USERNAME: ${{ inputs.kaggle_username }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          username = os.environ["KAGGLE_USERNAME"].strip()
          if not username or "/" in username or " " in username:
              raise SystemExit("Enter the Kaggle username only, without @, email, or URL.")

          folder = Path("eve-model/notebooks")
          metadata = {
              "id": f"{username}/eve-ar-95m-training",
              "title": "EVE AR 95M Training",
              "code_file": "kaggle_train_eve.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          (folder / "kernel-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8"
          )
          print("Prepared a private Kaggle notebook for:", username)
          PY

      - name: Submit notebook and request Kaggle GPU run
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push -p eve-model/notebooks --accelerator NvidiaTeslaT4 --timeout 43200

      - name: Print Kaggle notebook link
        env:
          KAGGLE_USERNAME: ${{ inputs.kaggle_username }}
        run: |
          echo "Kaggle notebook: https://www.kaggle.com/code/$KAGGLE_USERNAME/eve-ar-95m-training"
          echo "Submission accepted by the Kaggle CLI; inspect the Kaggle notebook page for actual GPU startup and training logs."
