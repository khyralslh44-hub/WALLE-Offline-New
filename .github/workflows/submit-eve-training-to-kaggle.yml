name: Submit EVE from-scratch training to Kaggle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/submit-eve-training-to-kaggle.yml"

permissions:
  contents: read

jobs:
  submit-kaggle-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EVE project
        uses: actions/checkout@v4
        with:
          ref: eve-companion-core-smoothness

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle==2.2.5"

      - name: Configure Kaggle credentials securely
        env:
          KAGGLE_CREDENTIAL: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os

          raw = os.environ.get("KAGGLE_CREDENTIAL", "").strip()
          if not raw:
              raise SystemExit("Missing repository secret KAGGLE_API_TOKEN.")

          if raw.startswith("KGAT_"):
              variable = "KAGGLE_API_TOKEN"
              value = raw
              kind = "new Kaggle access token"
          else:
              try:
                  parsed = json.loads(raw)
              except json.JSONDecodeError:
                  parsed = None

              if isinstance(parsed, dict):
                  value = str(parsed.get("key", "")).strip()
                  if not value:
                      raise SystemExit("The stored JSON has no 'key' field. Save the Kaggle API key value or the complete kaggle.json content.")
              else:
                  value = raw

              variable = "KAGGLE_KEY"
              kind = "legacy Kaggle API key"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("KAGGLE_USERNAME=conangg" + os.linesep)
              env_file.write(f"{variable}={value}" + os.linesep)

          print(f"Configured credentials as a {kind}; secret value was not printed.")
          PY

      - name: Verify Kaggle authentication
        run: |
          if ! kaggle kernels list --mine --page-size 1 > /tmp/kaggle-auth-check.log 2>&1; then
            cat /tmp/kaggle-auth-check.log
            echo "::error::Kaggle rejected the saved credential. Replace repository secret KAGGLE_API_TOKEN with either the complete active KGAT_ token or the key field from your Kaggle kaggle.json file."
            exit 1
          fi
          echo "Kaggle authentication succeeded."

      - name: Create Kaggle kernel metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          username = "conangg"
          folder = Path("eve-model/notebooks")
          notebook = folder / "kaggle_train_eve.ipynb"
          if not notebook.is_file():
              raise SystemExit(f"Notebook file not found: {notebook}")

          metadata = {
              "id": f"{username}/eve-ar-95m-training",
              "title": "EVE AR 95M Training",
              "code_file": "kaggle_train_eve.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          (folder / "kernel-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print("Prepared private EVE training notebook for Kaggle user:", username)
          PY

      - name: Submit notebook and request Kaggle GPU run
        run: |
          kaggle kernels push -p eve-model/notebooks --accelerator NvidiaTeslaT4 --timeout 43200

      - name: Print Kaggle notebook link
        run: |
          echo "Kaggle notebook: https://www.kaggle.com/code/conangg/eve-ar-95m-training"
          echo "Submission accepted by Kaggle CLI. Check Kaggle notebook logs to verify actual GPU startup and model training."
