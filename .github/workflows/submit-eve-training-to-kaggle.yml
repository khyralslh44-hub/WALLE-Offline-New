name: Submit EVE from-scratch training to Kaggle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KAGGLE_USERNAME: conangg

jobs:
  submit-kaggle-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EVE project
        uses: actions/checkout@v4
        with:
          ref: eve-companion-core-smoothness

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle==2.2.5"

      - name: Validate Kaggle token is configured
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Missing repository secret KAGGLE_API_TOKEN."
            exit 1
          fi
          if [ "${KAGGLE_API_TOKEN#KGAT_}" = "$KAGGLE_API_TOKEN" ]; then
            echo "::warning::The secret does not appear to start with KGAT_. Confirm that you copied the new Kaggle API token, not a username or the legacy kaggle.json contents."
          fi

      - name: Verify Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if ! kaggle kernels list --mine --page-size 1 > /tmp/kaggle-auth-check.log 2>&1; then
            cat /tmp/kaggle-auth-check.log
            echo "::error::Kaggle rejected KAGGLE_API_TOKEN. Replace the repository secret with the complete, active token copied from Kaggle Settings > API > Generate New Token. Do not paste it into workflow fields or logs."
            exit 1
          fi
          echo "Kaggle authentication succeeded."

      - name: Create Kaggle kernel metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          username = "conangg"
          folder = Path("eve-model/notebooks")
          notebook = folder / "kaggle_train_eve.ipynb"
          if not notebook.is_file():
              raise SystemExit(f"Notebook file not found: {notebook}")

          metadata = {
              "id": f"{username}/eve-ar-95m-training",
              "title": "EVE AR 95M Training",
              "code_file": "kaggle_train_eve.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          (folder / "kernel-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print("Prepared private EVE training notebook for Kaggle user:", username)
          PY

      - name: Submit notebook and request Kaggle GPU run
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push -p eve-model/notebooks --accelerator NvidiaTeslaT4 --timeout 43200

      - name: Print Kaggle notebook link
        run: |
          echo "Kaggle notebook: https://www.kaggle.com/code/conangg/eve-ar-95m-training"
          echo "Submission accepted by Kaggle CLI. Check Kaggle notebook logs to verify actual GPU startup and model training."
