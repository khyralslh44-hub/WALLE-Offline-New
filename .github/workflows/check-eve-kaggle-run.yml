name: Check EVE Kaggle training status

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check-eve-kaggle-run.yml"

permissions:
  contents: read

jobs:
  inspect-kaggle-run:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle==2.2.5"

      - name: Configure Kaggle credentials securely
        env:
          KAGGLE_CREDENTIAL: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("KAGGLE_CREDENTIAL", "").strip()
          if not raw:
              raise SystemExit("Missing repository secret KAGGLE_API_TOKEN.")
          config_dir = Path.home() / ".kaggle"
          config_dir.mkdir(mode=0o700, parents=True, exist_ok=True)
          os.chmod(config_dir, 0o700)
          if raw.startswith("KGAT_"):
              target = config_dir / "access_token"
              target.write_text(raw, encoding="ascii")
              os.chmod(target, 0o600)
              print("Configured Kaggle access token; value hidden.")
          else:
              try:
                  parsed = json.loads(raw)
              except json.JSONDecodeError:
                  parsed = None
              if isinstance(parsed, dict):
                  username = str(parsed.get("username", "conangg")).strip()
                  key = str(parsed.get("key", "")).strip()
              else:
                  username, key = "conangg", raw
              if not username or not key:
                  raise SystemExit("Invalid Kaggle credential format.")
              target = config_dir / "kaggle.json"
              target.write_text(json.dumps({"username": username, "key": key}), encoding="utf-8")
              os.chmod(target, 0o600)
              print("Configured legacy Kaggle API credential; value hidden.")
          PY

      - name: Inspect existing EVE kernel and accelerator metadata
        run: |
          echo "=== KAGGLE RUN STATUS ==="
          kaggle kernels status conangg/eve-ar-95m-training 2>&1 | tee /tmp/eve-status.txt || true
          echo "=== KAGGLE EXECUTION LOGS ==="
          kaggle kernels logs conangg/eve-ar-95m-training 2>&1 | tee /tmp/eve-logs.txt || true
          echo "=== KAGGLE OUTPUT FILE LIST ==="
          kaggle kernels files conangg/eve-ar-95m-training --page-size 100 2>&1 | tee /tmp/eve-files.txt || true
          echo "=== PULL KAGGLE-SAVED METADATA ==="
          mkdir -p /tmp/eve-current
          kaggle kernels pull conangg/eve-ar-95m-training -p /tmp/eve-current -m 2>&1 || true
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/eve-current/kernel-metadata.json")
          if p.is_file():
              d = json.loads(p.read_text())
              print(json.dumps({k:d.get(k) for k in ("id","enable_gpu","machine_shape","enable_internet","kernel_type")}, indent=2))
          else:
              print("Kaggle metadata pull did not produce kernel-metadata.json")
          PY

      - name: Create and submit a minimal GPU allocation probe
        run: |
          mkdir -p /tmp/eve-gpu-probe
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("/tmp/eve-gpu-probe")
          notebook = {
              "cells": [
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "id": "gpu-check",
                      "metadata": {},
                      "outputs": [],
                      "source": [
                          "import torch, json\n",
                          "report = {\n",
                          "  'torch': torch.__version__,\n",
                          "  'cuda_build': torch.version.cuda,\n",
                          "  'cuda_available': torch.cuda.is_available(),\n",
                          "  'device_count': torch.cuda.device_count(),\n",
                          "}\n",
                          "if torch.cuda.is_available():\n",
                          "    report['device_0'] = torch.cuda.get_device_name(0)\n",
                          "print(json.dumps(report, indent=2))\n",
                          "assert torch.cuda.is_available(), 'Kaggle did not allocate the requested GPU accelerator.'\n"
                      ]
                  }
              ],
              "metadata": {
                  "kernelspec": {"display_name":"Python 3","language":"python","name":"python3"},
                  "kaggle": {"accelerator":"NvidiaTeslaT4","dataSources":[],"isInternetEnabled":False,"language":"python","sourceType":"notebook"}
              },
              "nbformat": 4,
              "nbformat_minor": 5
          }
          (folder / "eve_gpu_probe.ipynb").write_text(json.dumps(notebook, indent=2), encoding="utf-8")
          metadata = {
              "id":"conangg/eve-gpu-availability-check",
              "title":"EVE GPU Availability Check",
              "code_file":"eve_gpu_probe.ipynb",
              "language":"python",
              "kernel_type":"notebook",
              "is_private":"true",
              "enable_gpu":"true",
              "enable_internet":"false",
              "machine_shape":"NvidiaTeslaT4",
              "dataset_sources":[],
              "competition_sources":[],
              "kernel_sources":[],
              "model_sources":[]
          }
          (folder / "kernel-metadata.json").write_text(json.dumps(metadata, indent=2), encoding="utf-8")
          print("Prepared a minimal GPU-only diagnostic notebook.")
          PY
          kaggle kernels push -p /tmp/eve-gpu-probe --accelerator NvidiaTeslaT4 --timeout 600

      - name: Report GPU probe status and logs
        run: |
          for i in $(seq 1 18); do
            STATUS="$(kaggle kernels status conangg/eve-gpu-availability-check 2>&1 || true)"
            echo "GPU probe attempt $i: $STATUS"
            case "$STATUS" in
              *KernelWorkerStatus.COMPLETE*|*KernelWorkerStatus.ERROR*) break ;;
            esac
            sleep 10
          done
          echo "=== GPU PROBE EXECUTION LOGS ==="
          kaggle kernels logs conangg/eve-gpu-availability-check 2>&1 || true
