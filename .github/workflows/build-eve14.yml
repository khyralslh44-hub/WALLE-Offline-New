name: Build EVE 14 APK (original source)

on:
  workflow_dispatch:
  push:
    paths:
      - 'eve-android (14).zip'
      - '.github/workflows/build-eve14.yml'

permissions:
  contents: read

concurrency:
  group: eve14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK from eve-android (14).zip
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="eve-android (14).zip"
          if [[ ! -f "$ZIP" ]]; then
            echo "::error::Required archive was not found: $ZIP"
            exit 1
          fi
          ls -lh "$ZIP"
          unzip -t "$ZIP" >/dev/null
          mkdir -p "$RUNNER_TEMP/eve14"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/eve14"

          SRC="$RUNNER_TEMP/eve14"
          for f in \
            "settings.gradle.kts" \
            "build.gradle.kts" \
            "app/build.gradle.kts" \
            "app/src/main/AndroidManifest.xml" \
            "app/src/main/java/com/eve/companion/MainActivity.kt"; do
            if [[ ! -s "$SRC/$f" ]]; then
              echo "::error::Missing required file in archive: $SRC/$f"
              exit 1
            fi
          done
          echo "Original source archive extracted and essential files verified."
          echo "---- MainActivity.kt lines 1-115 ----"
          nl -ba "$SRC/app/src/main/java/com/eve/companion/MainActivity.kt" | sed -n "1,115p"
          echo "---- Voice-related Kotlin declarations and factor references ----"
          grep -R -n -E "factor|class EveVoice|object EveVoice|class .*Voice|fun .*style|setSpeechRate" "$SRC/app/src/main/java" || true
          echo "---- Kotlin source files ----"
          find "$SRC/app/src/main/java" -type f -name "*.kt" -print | sort
          for vf in "$SRC/app/src/main/java/com/eve/companion/EveVoice.kt" "$SRC/app/src/main/java/com/eve/companion/Voice.kt"; do
            if [[ -s "$vf" ]]; then
              echo "---- $vf ----"
              nl -ba "$vf" | sed -n "1,240p"
            fi
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Add required vision model assets to build workspace
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/eve14"
          BASE="https://storage.googleapis.com/mediapipe-models"
          DEST="$SRC/app/src/main/assets/models"
          mkdir -p "$DEST"
          curl --fail --location --retry 4 --retry-delay 2 "$BASE/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite" --output "$DEST/objects.tflite"
          curl --fail --location --retry 4 --retry-delay 2 "$BASE/face_landmarker/face_landmarker/float16/1/face_landmarker.task" --output "$DEST/face.task"
          curl --fail --location --retry 4 --retry-delay 2 "$BASE/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task" --output "$DEST/gesture.task"
          curl --fail --location --retry 4 --retry-delay 2 "$BASE/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite" --output "$DEST/embed.tflite"
          curl --fail --location --retry 4 --retry-delay 2 "$BASE/image_classifier/efficientnet_lite0/int8/1/efficientnet_lite0.tflite" --output "$DEST/classify.tflite"
          for f in objects.tflite face.task gesture.task embed.tflite classify.tflite; do
            test -s "$DEST/$f"
            echo "$f: $(stat -c '%s' "$DEST/$f") bytes"
          done

      - name: Apply compile-only receiver disambiguation (keep uploaded ZIP unchanged)
        shell: bash
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/eve14/app/src/main/java/com/eve/companion/MainActivity.kt"
          # Inside TextToSpeech.apply, the unqualified name "voice" resolves to
          # TextToSpeech.voice. Explicitly reference MainActivity's EveVoice object.
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = 'setSpeechRate((rate / voice.factor(style)).coerceIn(0.4f, 2.0f))'
          new = 'setSpeechRate((rate / this@MainActivity.voice.factor(style)).coerceIn(0.4f, 2.0f))'
          if s.count(old) != 1:
              raise SystemExit("Expected exactly one voice.factor call; source was not changed")
          p.write_text(s.replace(old, new, 1))
          print("Applied one compile-only receiver qualification in the extracted build workspace.")
          PY

      - name: Prevent MediaPipe startup crash from R8 shrinking (temporary build workspace only)
        shell: bash
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/eve14/app/build.gradle.kts"
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          s = p.read_text()
          # MediaPipe/Flogger uses runtime stack inspection; R8 obfuscation/shrinking
          # can break this lookup in release builds. Keep the original ZIP untouched.
          patterns = [
              r'(?m)(\bisMinifyEnabled\s*=\s*)true\b',
              r'(?m)(\bminifyEnabled\s+)true\b',
          ]
          count = 0
          for pattern in patterns:
              s, n = re.subn(pattern, r'\g<1>false', s)
              count += n
          if count == 0:
              print("No enabled minification declaration found; refusing to silently produce an unmodified release.")
              print(s)
              raise SystemExit(2)
          s, resource_count_1 = re.subn(r'(?m)(\bisShrinkResources\s*=\s*)true\b', r'\g<1>false', s)
          s, resource_count_2 = re.subn(r'(?m)(\bshrinkResources\s+)true\b', r'\g<1>false', s)
          print(f"Disabled resource shrinking in {resource_count_1 + resource_count_2} declaration(s).")
          p.write_text(s)
          print(f"Disabled R8 minification in {count} enabled declaration(s) for diagnostic-safe release.")
          PY

      - name: Inspect launcher icon resources in original project
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/eve14"
          echo "---- Manifest application icon declarations ----"
          grep -n -E 'android:(icon|roundIcon)|<application' "$SRC/app/src/main/AndroidManifest.xml" || true
          echo "---- Launcher icon resource files ----"
          find "$SRC/app/src/main/res" -type f | grep -E '/(mipmap|drawable).*(launcher|ic_launcher)' | sort || true
          echo "---- All mipmap resources ----"
          find "$SRC/app/src/main/res" -type f -path '*/mipmap*/*' | sort || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build original lite APK variants
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$RUNNER_TEMP/eve14" assembleLiteDebug assembleLiteRelease

      - name: Verify generated APKs
        shell: bash
        run: |
          set -euo pipefail
          APKDIR="$RUNNER_TEMP/eve14/app/build/outputs/apk"
          test -s "$APKDIR/lite/debug/app-lite-debug.apk"
          test -s "$APKDIR/lite/release/app-lite-release.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APKDIR/lite/debug/app-lite-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APKDIR/lite/release/app-lite-release.apk"
          ls -lh "$APKDIR/lite/"*/*.apk

      - name: Upload EVE 14 APKs
        uses: actions/upload-artifact@v4
        with:
          name: EVE-14-APK
          path: |
            ${{ runner.temp }}/eve14/app/build/outputs/apk/lite/debug/*.apk
            ${{ runner.temp }}/eve14/app/build/outputs/apk/lite/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
