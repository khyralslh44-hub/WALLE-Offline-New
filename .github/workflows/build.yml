
name: Build WALL-E APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o "WALLE_Offline_Android_Fixed (2).zip" -d project

      - name: Build APK
        run: |
          GRADLE_FILE=$(find project -name gradlew -type f | head -n 1)
          if [ -n "$GRADLE_FILE" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_FILE")
            chmod +x "$GRADLE_FILE"
            cd "$PROJECT_DIR"
            ./gradlew assembleDebug --stacktrace
          else
            echo "لم يتم العثور على ملف gradlew داخل المشروع"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WALL-E-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

