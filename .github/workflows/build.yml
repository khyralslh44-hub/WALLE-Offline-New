name: Build WALL-E APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WALLE_Offline_Android_Fixed.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Extract project
        run: |
          mkdir project
          unzip -o "WALLE_Offline_Android_Fixed.zip" -d project
          find project -name settings.gradle -print

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          cd project
          PROJECT_DIR=$(find . -name settings.gradle -printf '%h\n' | head -1)
          cd "$PROJECT_DIR"
          ../gradle-8.7/bin/gradle assembleDebug --stacktrace
