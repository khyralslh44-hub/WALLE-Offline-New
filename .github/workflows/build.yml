name: WALL-E Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'WALLE_Offline_Android_Fixed (2).zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl openjdk-17-jdk
      - name: Extract project
        run: |
          mkdir -p project
          unzip -o 'WALLE_Offline_Android_Fixed (2).zip' -d project
          # Android Java compile defaults to 1.8; match Kotlin to it.
          find project -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -exec sed -i 's/jvmTarget[[:space:]]*=[[:space:]]*"17"/jvmTarget = "1.8"/g; s/jvmTarget[[:space:]]*=[[:space:]]*\x2717\x27/jvmTarget = \x271.8\x27/g' {} +
          find project -name settings.gradle -print
          # Use the same JVM target for Java and Kotlin to avoid target mismatch.
                    find project -name build.gradle -exec sed -i 's/jvmTarget[[:space:]]*=[[:space:]]*"1.8"/jvmTarget = "17"/g' {} +
          # Normalize all common Java/Kotlin target spellings in Gradle config.
          find project \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradle.properties' \) -type f -exec sed -i 's/1\\.8/17/g; s/VERSION_1_8/VERSION_17/g' {} +
          echo '--- Verify remaining JVM 1.8 settings ---'
          if grep -R -n -E 'VERSION_1_8|1\\.8' project --include='*.gradle' --include='*.gradle.kts' --include='gradle.properties'; then
            echo 'ERROR: Found a remaining JVM 1.8 setting'
            exit 1
          fi
      - name: Build APK
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          SETTINGS="$(find "$GITHUB_WORKSPACE/project" -name settings.gradle -print -quit)"
          test -n "$SETTINGS"
          cd "$(dirname "$SETTINGS")"
          /tmp/gradle-8.7/bin/gradle assembleDebug --stacktrace
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: WALL-E-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
