name: WALL-E Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'WALLE_Offline_Android_Fixed (2).zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check and extract project
        run: |
          set -euo pipefail
          ZIP='WALLE_Offline_Android_Fixed (2).zip'
          test -f "$ZIP" || { echo "ERROR: Project ZIP not found: $ZIP"; exit 1; }
          mkdir -p project
          unzip -o "$ZIP" -d project
          SETTINGS="$(find project \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS" || { echo "ERROR: settings.gradle(.kts) not found in ZIP"; exit 1; }
          echo "GRADLE_ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Align Java and Kotlin JVM targets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path("project")
          candidates = [p for p in (root.rglob("app/build.gradle"), root.rglob("app/build.gradle.kts"))]
          app_files = []
          for group in candidates:
              app_files.extend(group)
          if not app_files:
              sys.exit("ERROR: app/build.gradle or app/build.gradle.kts not found")
          p = app_files[0]
          s = p.read_text()

          # Normalize common Java 8/Kotlin 1.8 target declarations without relying on shell quoting.
          s = re.sub(r'(jvmTarget\s*=\s*["\'])(?:1\.8|8)(["\'])', r'\g<1>17\2', s)
          s = re.sub(r'JavaVersion\.VERSION_1_8', 'JavaVersion.VERSION_17', s)
          s = re.sub(r'(sourceCompatibility\s*=\s*["\'])(?:1\.8|8)(["\'])', r'\g<1>17\2', s)
          s = re.sub(r'(targetCompatibility\s*=\s*["\'])(?:1\.8|8)(["\'])', r'\g<1>17\2', s)

          if p.suffix == ".kts":
              s += """

          // CI safeguard: align Java and Kotlin bytecode targets on JVM 17.
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          else:
              s += """

          // CI safeguard: align Java and Kotlin bytecode targets on JVM 17.
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          p.write_text(s)
          print(f"Aligned JVM targets in {p}")
          PY

      - name: Build APK
        working-directory: ${{ env.GRADLE_ROOT }}
        run: |
          set -euxo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.7/bin/gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WALL-E-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
