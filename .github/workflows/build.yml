yaml
name: Build WALL-E APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WALLE_Offline_Android_Fixed (2).zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o "WALLE_Offline_Android_Fixed (2).zip" -d project
          find project -name settings.gradle -print

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          PROJECT_DIR="$(dirname "$(find project -name settings.gradle | head -n 1)")"
          cd "$PROJECT_DIR"
          ../../gradle-8.7/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WALLE-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

