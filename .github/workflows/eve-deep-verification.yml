name: EVE Deep Offline Vision Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'eve-project/**'
      - '.github/workflows/eve-deep-verification.yml'
      - '.github/scripts/run-deep-face-test.sh'
      - '.github/scripts/emulator-smoke-test.sh'

concurrency:
  group: eve-deep-offline-verification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  instrumented-face-test:
    # Run the deep local face/FER verification on pushes as well as manual dispatch.
    name: Real face-model test (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Begin the heavyweight face/FER instrumentation on API 29, where the smoke
      # suite has already completed reliably. The same app remains compatible with newer Android.
      matrix:
        api-level: [29]

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://services.gradle.org/distributions/gradle-8.9-bin.zip" --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"

      - name: Download and pin face-test fixture
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="eve-project/app/src/androidTest/assets/face_fixture.jpg"
          mkdir -p "$(dirname "$FIXTURE")"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/googlesamples/mlkit/f1047837fe1e02d58063bfc30b830fad23ffbc35/ios/quickstarts/vision/Resources/grace_hopper.jpg" \
            --output "$FIXTURE"
          EXPECTED="d2a427810f679db537236c5430873a81a62ef412"
          ACTUAL="$(git hash-object "$FIXTURE")"
          echo "Fixture Git blob hash: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: face fixture hash changed; refusing unreviewed input."
            exit 1
          fi
          file "$FIXTURE" || true
          sha256sum "$FIXTURE" | tee "$RUNNER_TEMP/face-fixture-sha256.txt"

      - name: Download and pin offline facial-expression model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/eve_emotion_model.tflite"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/EnricoZanetti/moodstream/af59e5cdbd45936051a27e694b160996526f11bb/models/emotion_model.tflite" \
            --output "$MODEL"
          EXPECTED="508da02d7ebad42e160ad4df0e946e2a16bf4c66"
          ACTUAL="$(git hash-object "$MODEL")"
          echo "FER model Git blob hash: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: emotion model hash changed; refusing an unreviewed model."
            exit 1
          fi
          ls -lh "$MODEL"

      - name: Verify pinned test inputs match the integration test
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="eve-project/app/src/androidTest/assets/face_fixture.jpg"
          TEST_SOURCE="eve-project/app/src/androidTest/java/com/eve/robot/FaceVisionIntegrationTest.kt"
          TEST_SCRIPT=".github/scripts/run-deep-face-test.sh"
          test -s "$FIXTURE"
          test -s "eve-project/app/src/main/assets/eve_emotion_model.tflite"
          grep -Fq 'face_fixture.jpg' "$TEST_SOURCE"
          grep -Fq 'face_fixture.jpg' "$TEST_SCRIPT"
          grep -Fq 'face_fixture.jpg' ".github/workflows/eve-deep-verification.yml"
          echo "PASS: fixture path is consistent across workflow, test runner, and instrumentation test."
          echo "Fixture SHA256:"
          sha256sum "$FIXTURE"
          echo "FER model SHA256:"
          sha256sum eve-project/app/src/main/assets/eve_emotion_model.tflite

      - name: Prebuild app, instrumentation APK, and CPU stress tests before emulator boot
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon --stacktrace -p eve-project \
            testDebugUnitTest assembleDebug assembleDebugAndroidTest
          test -s eve-project/app/build/outputs/apk/debug/app-debug.apk
          test -s eve-project/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Run unit, adversarial affect stress, and real face-model tests offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # Use the lightweight AOSP system image. This test uses bundled ML Kit/TFLite
          # models and does not require Google Play Services; avoiding GMS background tasks
          # prevents unrelated emulator ANRs while networking is disabled.
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: bash .github/scripts/run-deep-face-test.sh "${{ matrix.api-level }}"

      - name: Upload deep-test report, screenshots, and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Deep-Verification-API-${{ matrix.api-level }}
          path: |
            eve-deep-results/**
            eve-project/app/build/reports/tests/testDebugUnitTest/**
            eve-project/app/build/reports/androidTests/connected/**
            eve-project/app/build/outputs/androidTest-results/connected/**
            eve-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
