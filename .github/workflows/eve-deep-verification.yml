name: EVE Deep Offline Vision Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'eve-project/**'
      - '.github/workflows/eve-deep-verification.yml'
      - '.github/scripts/run-deep-face-test.sh'
      - '.github/scripts/emulator-smoke-test.sh'
      - '.github/scripts/fetch-moonshine-tiny-ar.sh'
      - '.github/scripts/create-moonshine-tokens.py'

concurrency:
  group: eve-deep-offline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented-face-test:
    # Run the deep local face/FER verification on pushes as well as manual dispatch.
    name: Real face-model test (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Begin the heavyweight face/FER instrumentation on API 29, where the smoke
      # suite has already completed reliably. The same app remains compatible with newer Android.
      matrix:
        api-level: [29]

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://services.gradle.org/distributions/gradle-8.9-bin.zip" --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"

      - name: Add the pinned ARM-compatible sherpa-onnx runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eve-project/app/libs
          AAR="eve-project/app/libs/sherpa-onnx-2.0.1.aar"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" \
            --output "$AAR"
          ACTUAL="$(sha256sum "$AAR" | awk '{print $1}')"
          EXPECTED="a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7"
          test "$ACTUAL" = "$EXPECTED"
          echo "PASS: sherpa-onnx 2.0.1 AAR sha256=$ACTUAL"

      - name: Download and pin face-test fixture
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="eve-project/app/src/androidTest/assets/face_fixture.jpg"
          mkdir -p "$(dirname "$FIXTURE")"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/googlesamples/mlkit/f1047837fe1e02d58063bfc30b830fad23ffbc35/ios/quickstarts/vision/Resources/grace_hopper.jpg" \
            --output "$FIXTURE"
          EXPECTED="d2a427810f679db537236c5430873a81a62ef412"
          ACTUAL="$(git hash-object "$FIXTURE")"
          echo "Fixture Git blob hash: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: face fixture hash changed; refusing unreviewed input."
            exit 1
          fi
          file "$FIXTURE" || true
          sha256sum "$FIXTURE" | tee "$RUNNER_TEMP/face-fixture-sha256.txt"

      - name: Download and pin a second person portrait for identity negative control
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="eve-project/app/src/androidTest/assets/face_fixture_biden.jpg"
          mkdir -p "$(dirname "$FIXTURE")"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
            "https://raw.githubusercontent.com/ageitgey/face_recognition/9f3061aaeed9a8756d2c970f5dfe066617a8281d/examples/biden.jpg" --output "$FIXTURE"
          EXPECTED="3a0bdc974e9067b1595a6a623a3d898265b0a7a2"
          ACTUAL="$(git hash-object "$FIXTURE")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: different-person identity fixture hash changed."
            exit 1
          fi
          sha256sum "$FIXTURE" | tee "$RUNNER_TEMP/identity-negative-fixture-sha256.txt"
          echo "PASS: distinct-person negative-control fixture is pinned."
          
      - name: Download and pin offline facial-expression model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/eve_emotion_model.tflite"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/EnricoZanetti/moodstream/af59e5cdbd45936051a27e694b160996526f11bb/models/emotion_model.tflite" \
            --output "$MODEL"
          EXPECTED="508da02d7ebad42e160ad4df0e946e2a16bf4c66"
          ACTUAL="$(git hash-object "$MODEL")"
          echo "FER model Git blob hash: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: emotion model hash changed; refusing an unreviewed model."
            exit 1
          fi
          ls -lh "$MODEL"

      - name: Download and pin offline hand-gesture model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/gesture_recognizer.task"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/aa-del9/silent-speech/65249bd95a6f3467fbe67e175058f12cadbb9715/client/app/src/main/assets/gesture_recognizer.task" \
            --output "$MODEL"
          EXPECTED="33524de2b1595e3b755e50c0deaabd602af30085"
          ACTUAL="$(git hash-object "$MODEL")"
          echo "Hand gesture model Git blob hash: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          ls -lh "$MODEL"

      - name: Download and pin offline COCO object detector
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/efficientdet_lite0.tflite"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite" \
            --output "$MODEL"
          ACTUAL_SHA256="$(sha256sum "$MODEL" | awk '{print $1}')"
          ACTUAL_BYTES="$(stat -c '%s' "$MODEL")"
          test "$ACTUAL_BYTES" -ge 3500000
          test "$ACTUAL_BYTES" -le 5500000
          echo "PASS: compact EfficientDet-Lite0 INT8 bytes=$ACTUAL_BYTES sha256=$ACTUAL_SHA256"
          sha256sum "$MODEL" | tee "$RUNNER_TEMP/object-detector-sha256.txt"

      - name: Download and pin offline pose landmarker for activity reasoning
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/pose_landmarker_lite.task"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 180 \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" \
            --output "$MODEL"
          EXPECTED_SHA256="59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a"
          ACTUAL_SHA256="$(sha256sum "$MODEL" | awk '{print $1}')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          echo "PASS: pinned Pose Landmarker Lite verified SHA-256=$ACTUAL_SHA256 bytes=$(stat -c '%s' "$MODEL")"

      - name: Download broad offline ImageNet image classifier
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/efficientnet_lite0_int8.tflite"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            "https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0/int8/latest/efficientnet_lite0.tflite" \
            --output "$MODEL"
          BYTES="$(stat -c '%s' "$MODEL")"
          SHA256="$(sha256sum "$MODEL" | awk '{print $1}')"
          EXPECTED_SHA256="bc2ffe19c1118de0c0c2a9088992da5589722656e0fba81421385300a4a34b16"
          EXPECTED_BYTES=5434517
          echo "EfficientNet-Lite0 ImageNet SHA-256: $SHA256"
          echo "EfficientNet-Lite0 ImageNet bytes: $BYTES"
          if [ "$SHA256" != "$EXPECTED_SHA256" ] || [ "$BYTES" -ne "$EXPECTED_BYTES" ]; then
            echo "FAIL: ImageNet classifier model differs from the reviewed pinned model."
            exit 1
          fi
          sha256sum "$MODEL" | tee "$RUNNER_TEMP/imagenet-classifier-sha256.txt"
          echo "PASS: broad offline ImageNet classifier downloaded for integration testing."

      - name: Download and pin offline MobileFaceNet identity model
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="eve-project/app/src/main/assets"
          MODEL="$ASSETS/MobileFaceNet.tflite"
          LICENSE="$ASSETS/mobilefacenet_model_license.txt"
          mkdir -p "$ASSETS"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "https://raw.githubusercontent.com/syaringan357/Android-MobileFaceNet-MTCNN-FaceAntiSpoofing/d635649e711f5e16e6cd3dc06cbb329cd8d1d3b7/app/src/main/assets/MobileFaceNet.tflite" --output "$MODEL"
          EXPECTED="3249c511be86366d5d0a137dc6f4af321af28678"
          ACTUAL="$(git hash-object "$MODEL")"
          echo "MobileFaceNet Git blob hash: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: MobileFaceNet model hash changed; refusing an unreviewed model."
            exit 1
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "https://raw.githubusercontent.com/syaringan357/Android-MobileFaceNet-MTCNN-FaceAntiSpoofing/d635649e711f5e16e6cd3dc06cbb329cd8d1d3b7/LICENSE" --output "$LICENSE"
          grep -Fq "MIT License" "$LICENSE"
          ls -lh "$MODEL" "$LICENSE"
          echo "PASS: pinned offline face-identity model and its license are ready."
      - name: Download and pin offline thumb-up gesture fixture
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="eve-project/app/src/androidTest/assets/gesture_thumb_up.jpg"
          mkdir -p "$(dirname "$FIXTURE")"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/wgnrto/uniteye/0cbbc9bfbb0d0b0b95b57deec3095e5d5ac81996/com.github.homuler.mediapipe/Tests/Resources/thumb-up.jpg" \
            --output "$FIXTURE"
          EXPECTED="781f7e5eb60c90201f6bb348a433bae5aee06da4"
          ACTUAL="$(git hash-object "$FIXTURE")"
          echo "Thumb-up fixture Git blob hash: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: thumb-up fixture hash mismatch; refusing unreviewed input."
            exit 1
          fi
          file "$FIXTURE" || true
          sha256sum "$FIXTURE" | tee "$RUNNER_TEMP/thumb-up-fixture-sha256.txt"

      - name: Download compact fully offline Moonshine Tiny Arabic model
        shell: bash
        run: bash .github/scripts/fetch-moonshine-tiny-ar.sh

      - name: Verify pinned test inputs match the integration test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(".")
          def fail(message):
              print("FAIL:", message, flush=True)
              raise SystemExit(1)

          def expect_file(path, minimum=1):
              p = root / path
              if not p.is_file() or p.stat().st_size < minimum:
                  fail(f"required file missing/too small: {path}")
              print(f"PASS: file {path} ({p.stat().st_size} bytes)", flush=True)
              return p

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def git_blob_sha1(path):
              data = path.read_bytes()
              return hashlib.sha1(b"blob " + str(len(data)).encode() + bytes([0]) + data).hexdigest()

          face = expect_file("eve-project/app/src/androidTest/assets/face_fixture.jpg")
          if git_blob_sha1(face) != "d2a427810f679db537236c5430873a81a62ef412":
              fail("face fixture Git blob SHA-1 mismatch")
          biden = expect_file("eve-project/app/src/androidTest/assets/face_fixture_biden.jpg")
          if git_blob_sha1(biden) != "3c17508bb91554c637a2eabddfae790e5bb1caba93130814fc2ac50be9760c4c":
              fail("different-person face fixture Git blob SHA-1 mismatch")
          gesture = expect_file("eve-project/app/src/androidTest/assets/gesture_thumb_up.jpg")
          if git_blob_sha1(gesture) != "781f7e5eb60c90201f6bb348a433bae5aee06da4":
              fail("thumb-up fixture Git blob SHA-1 mismatch")

          expect_file("eve-project/app/src/main/assets/eve_emotion_model.tflite")
          object_model = expect_file("eve-project/app/src/main/assets/efficientdet_lite0.tflite")
          if not 3_500_000 <= object_model.stat().st_size <= 5_500_000:
              fail("EfficientDet INT8 file size outside 3.5–5.5 MB")
          imagenet = expect_file("eve-project/app/src/main/assets/efficientnet_lite0_int8.tflite")
          if imagenet.stat().st_size != 5_434_517 or sha256(imagenet) != "bc2ffe19c1118de0c0c2a9088992da5589722656e0fba81421385300a4a34b16":
              fail("ImageNet INT8 model does not match the pinned model")
          pose = expect_file("eve-project/app/src/main/assets/pose_landmarker_lite.task")
          if sha256(pose) != "59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a":
              fail("Pose Landmarker model SHA-256 mismatch")
          identity = expect_file("eve-project/app/src/main/assets/MobileFaceNet.tflite")
          if git_blob_sha1(identity) != "3249c511be86366d5d0a137dc6f4af321af28678":
              fail("MobileFaceNet model Git blob SHA-1 mismatch")
          license_file = expect_file("eve-project/app/src/main/assets/mobilefacenet_model_license.txt")
          if "MIT License" not in license_file.read_text(encoding="utf-8", errors="replace"):
              fail("MobileFaceNet MIT license text missing")

          tokens = expect_file("eve-project/app/src/main/assets/eve_moonshine_ar_tokens.txt")
          if sha256(tokens) != "5e5890351df3fa5c6e87471fa37b888e2634cc2194f3885e8e651eb52de26678":
              fail("Moonshine token file SHA-256 mismatch")
          expect_file("eve-project/app/src/main/assets/moonshine_ai_community_license.txt")
          expect_file("eve-project/app/src/main/assets/moonshine_ai_notice.txt")

          asr_source = expect_file("eve-project/app/src/main/java/com/eve/robot/OfflineArabicSpeech.kt").read_text(encoding="utf-8")
          for pinned in (
              "189c63a96dbedcbce32987ccb2ef52367b5392744fdc9b05f3d5442b0db4e85f",
              "c3d7481beb40f0880155195a12c619e035fd67249b8d0315d90f7f32dca4d380",
              "downloadVerifiedModel",
              "TOKENS_SHA256",
          ):
              if pinned not in asr_source:
                  fail(f"OfflineArabicSpeech source missing required pinned feature: {pinned}")
          assets = root / "eve-project/app/src/main/assets"
          large_weights = list(assets.glob("eve_moonshine_ar_*int8.onnx"))
          if large_weights:
              fail("large Arabic ONNX weights unexpectedly present in APK assets: " + ", ".join(p.name for p in large_weights))
          print("PASS: Arabic ONNX weights stay external and are installed once into private app storage.", flush=True)

          face_test = expect_file("eve-project/app/src/androidTest/java/com/eve/robot/FaceIdentityIntegrationTest.kt").read_text(encoding="utf-8")
          if "face_fixture_biden.jpg" not in face_test or "FACE_IDENTITY_MODEL_PASS" not in face_test:
              fail("FaceIdentityIntegrationTest does not reference both fixtures/pass marker")
          gesture_test = expect_file("eve-project/app/src/androidTest/java/com/eve/robot/HandGestureIntegrationTest.kt").read_text(encoding="utf-8")
          if "gesture_thumb_up.jpg" not in gesture_test:
              fail("HandGestureIntegrationTest does not reference thumb-up fixture")
          pose_test = expect_file("eve-project/app/src/androidTest/java/com/eve/robot/PoseVisionIntegrationTest.kt").read_text(encoding="utf-8")
          if "POSE_MODEL_PASS" not in pose_test:
              fail("PoseVisionIntegrationTest pass marker missing")
          print("PASS: face, gesture, and pose fixtures are wired to their instrumentation tests.", flush=True)
          print("PASS: every pinned input and compact Arabic model metadata passed preflight.", flush=True)
          PY

      - name: Download and verify offline MediaPipe pose model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/pose_landmarker_lite.task"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task" \
            --output "$MODEL"
          test -s "$MODEL"
          # The task bundle must be present before Gradle packages app assets.
          file "$MODEL"
          echo "Pose model downloaded: $(wc -c < "$MODEL") bytes"

      - name: Prebuild app, instrumentation APK, and CPU stress tests before emulator boot
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon --stacktrace -p eve-project \
            testDebugUnitTest assembleDebug assembleDebugAndroidTest
          test -s eve-project/app/build/outputs/apk/debug/app-debug.apk
          test -s eve-project/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Validate deep-test shell syntax before emulator boot
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/run-deep-face-test.sh
          bash -n .github/scripts/fetch-moonshine-tiny-ar.sh
          python3 -m py_compile .github/scripts/create-moonshine-tokens.py
          echo "PASS: deep verification scripts parse cleanly."

      - name: Run unit, adversarial affect stress, and real face-model tests offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # Use the lightweight AOSP system image. This test uses bundled ML Kit/TFLite
          # models and does not require Google Play Services; avoiding GMS background tasks
          # prevents unrelated emulator ANRs while networking is disabled.
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: bash .github/scripts/run-deep-face-test.sh "${{ matrix.api-level }}"

      - name: Upload deep-test report, screenshots, and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Deep-Verification-API-${{ matrix.api-level }}
          path: |
            eve-deep-results/**
            eve-project/app/build/reports/tests/testDebugUnitTest/**
            eve-project/app/build/reports/androidTests/connected/**
            eve-project/app/build/outputs/androidTest-results/connected/**
            eve-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
