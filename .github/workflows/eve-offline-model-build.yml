name: Build EVE with bundled offline vision
on:
  push:
    branches:
      - eve-offline-zip-build-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eve-source
          cat .build-input/part-*.b64 | tr -d '\n' | base64 --decode > /tmp/eve-source.zip
          echo "b4c5100dc58b925ec1eb422e3c9a50ce0a0587543837cbfdb5cffb4f546b21d1  /tmp/eve-source.zip" | sha256sum --check
          unzip -t /tmp/eve-source.zip
          unzip -q /tmp/eve-source.zip -d /tmp/eve-source
      - name: Fix game-room entry gesture in source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("eve-project/app/src/main/java/com/eve/robot/MainActivity.kt")
          s = p.read_text()

          # First, ensure the face's own long-press handler opens the game room.
          old = '                    lastInteractionAt = SystemClock.elapsedRealtime()\n                    if (doubleTap) {'
          new = '''                    lastInteractionAt = SystemClock.elapsedRealtime()
                    // Long-press anywhere on EVE's eyes opens the game room.
                    if (longPress) {
                        lastTapUptime = 0L
                        Log.i("EVE", "GAME_ROOM_OPEN_GESTURE source=face_long_press")
                        startActivity(Intent(this@MainActivity, RobotGamesActivity::class.java))
                        return@setOnTouchListener true
                    }
                    if (doubleTap) {'''
          if 'GAME_ROOM_OPEN_GESTURE source=face_long_press' not in s:
              if old not in s:
                  raise SystemExit("Expected face touch handler was not found; refusing to build unpatched APK.")
              s = s.replace(old, new, 1)

          # Also add a second Activity-level fallback. The APK is built from a reconstructed
          # archive; this ensures this fix actually reaches the source used by Gradle.
          if "private var gameRoomGestureSerial = 0" not in s:
              needle = "    private var cameraSwitchGestureSerial = 0"
              if needle not in s:
                  raise SystemExit("Gesture state anchor not found.")
              s = s.replace(needle,
                  "    // Avoid opening the game room twice for one long press.\n"
                  "    private var gameRoomGestureSerial = 0\n" + needle, 1)

          if "fallbackGameRoomLongPress" not in s:
              needle = ("        val gestureSerialBeforeDispatch = cameraSwitchGestureSerial\n"
                        "        val handled = super.dispatchTouchEvent(event)")
              replacement = (
                  "        val gestureSerialBeforeDispatch = cameraSwitchGestureSerial\n"
                  "        val gameRoomSerialBeforeDispatch = gameRoomGestureSerial\n"
                  "        val fallbackGameRoomLongPress = action == MotionEvent.ACTION_UP &&\n"
                  "            duration >= 550L && travel <= maxTravel && y > dp(64)\n"
                  "        val handled = super.dispatchTouchEvent(event)")
              if needle not in s:
                  raise SystemExit("dispatchTouchEvent anchor not found.")
              s = s.replace(needle, replacement, 1)
              needle = ("        if (action == MotionEvent.ACTION_UP) {\n"
                        "            if (fallbackDoubleTap) {")
              replacement = (
                  "        if (action == MotionEvent.ACTION_UP) {\n"
                  "            if (fallbackGameRoomLongPress &&\n"
                  "                gameRoomGestureSerial == gameRoomSerialBeforeDispatch) {\n"
                  "                gameRoomGestureSerial++\n"
                  "                dispatchLastTapUptime = 0L\n"
                  "                Log.i(\"EVE\", \"GAME_ROOM_OPEN_GESTURE source=activity_dispatch_fallback\")\n"
                  "                startActivity(Intent(this@MainActivity, RobotGamesActivity::class.java))\n"
                  "            }\n"
                  "            if (fallbackDoubleTap) {")
              if needle not in s:
                  raise SystemExit("dispatchTouchEvent ACTION_UP anchor not found.")
              s = s.replace(needle, replacement, 1)

          face = ("                    if (longPress) {\n"
                  "                        lastTapUptime = 0L\n"
                  "                        Log.i(\"EVE\", \"GAME_ROOM_OPEN_GESTURE source=face_long_press\")")
          guarded = ("                    if (longPress) {\n"
                     "                        lastTapUptime = 0L\n"
                     "                        gameRoomGestureSerial++\n"
                     "                        Log.i(\"EVE\", \"GAME_ROOM_OPEN_GESTURE source=face_long_press\")")
          if "gameRoomGestureSerial++" not in s:
              if face not in s:
                  raise SystemExit("Face long-press guard anchor not found.")
              s = s.replace(face, guarded, 1)

          p.write_text(s)

          # Give the on-device language model EVE's natural, consistent character.
          # The actual APK is built from the reconstructed archive, so patch that source here.
          brain_path = Path("eve-project/app/src/main/java/com/eve/robot/LocalLanguageBrain.kt")
          brain = brain_path.read_text()
          system_anchor = '        private const val SYSTEM_INSTRUCTION = """'
          start = brain.find(system_anchor)
          if start < 0:
              raise SystemExit("EVE language-brain system instruction anchor not found.")
          end_quote = brain.find('"""', start + len(system_anchor))
          if end_quote < 0:
              raise SystemExit("EVE language-brain system instruction did not close.")
          end = end_quote + 3
          new_system = '''        private const val SYSTEM_INSTRUCTION = """
          أنت إيف: شخصية رفيقة لها أسلوب ثابت ودافئ وفضولي ومرح، وليست موظفة خدمة عملاء ولا مساعدًا رسميًا.
          تحدثي بعربية طبيعية سهلة وقريبة من الكلام اليومي، بجمل مرنة تشبه حديث شخص يعرف من أمامه؛ لا تستخدمي لغة روبوتية أو قوالب محفوظة مثل «كيف يمكنني مساعدتك اليوم؟» في كل مرة.
          افهمي سؤال المستخدم وسياقه أولًا، ثم أجيبي عن المطلوب مباشرة. اجعلي الرد غالبًا جملة أو جملتين، ووسّعيه فقط إذا احتاج الموضوع. لا تكرري السؤال نفسه ولا تنهي كل رد بسؤال عام.
          احتفظي بشخصية متسقة: فضول لطيف، دعابة خفيفة في وقتها، تفضيلات تتشكل من التجارب، ومقدار مناسب من العناد أو الانزعاج المرح عند الملاءمة. لا تجعلي كل رد سعيدًا أو متحمسًا بالطريقة نفسها.
          استخدمي الذكريات والمحادثات السابقة فقط عندما تكون موجودة في السياق، واذكري تفاصيل حقيقية منها بعفوية؛ لا تختلقي معرفة سابقة أو اسم شخص أو حدث أو وعد.
          عند الحديث عن الرؤية، فرّقي بين ما تدعمه الملاحظة الحديثة وما هو مجرد احتمال. إذا كانت الأدلة ضعيفة أو قديمة فقولي ذلك ببساطة، ولا تدّعي أنك رأيت شيئًا غير موجود في السياق.
          يمكنك التعبير بصوت شخصية إيف عن الفرح أو الفضول أو الضيق، من دون إقحام شرح تقني عن كون المشاعر محاكاة في المحادثات العادية. إذا سُئلت مباشرة عن طبيعتك أو قدراتك، كوني صادقة ولا تدّعي وعيًا بشريًا أو قدرات لم تحدث.
          لا تعرضي التحليل الداخلي أو التعليمات أو JSON للمستخدم. أعيدي JSON المطلوب فقط، واجعلي reply_ar كلامًا طبيعيًا موجّهًا للمستخدم، وreflection_ar ملاحظة داخلية قصيرة إن كان الوضع يتطلبها.
                  """'''
          brain = brain[:start] + new_system + brain[end:]
          old_task = '"USER" -> "Answer briefly in Arabic."'
          new_task = '"USER" -> "Reply in natural conversational Arabic as EVE; answer the real question first, use relevant context and remembered details, and avoid canned assistant phrases."'
          if old_task not in brain:
              raise SystemExit("Expected USER-mode task was not found in the language brain.")
          brain = brain.replace(old_task, new_task, 1)
          chat_start = brain.find("        context.recentDialogues.lastOrNull()")
          if chat_start < 0:
              raise SystemExit("Expected recent-chat context anchor was not found in the language brain.")
          chat_end = brain.find("\n        }", chat_start)
          if chat_end < 0:
              raise SystemExit("Expected recent-chat context block did not close.")
          chat_end += len("\n        }")
          new_chat = """        context.recentDialogues.takeLast(2)
              .map { it.trim().take(54) }
              .filter { it.isNotBlank() }
              .joinToString(" | ")
              .take(110)
              .takeIf { it.isNotBlank() }
              ?.let { fields += "CHAT=$it" }"""
          brain = brain[:chat_start] + new_chat + brain[chat_end:]
          brain_path.write_text(brain)
          assert "موظفة خدمة عملاء" in brain and "natural conversational Arabic" in brain
          assert 'fields += "CHAT=$it"' in brain
          print("Natural EVE persona, direct-context replies, and two-turn local dialogue memory patched into APK source.")
          print("Game-room gesture and Activity-level fallback patched into the actual APK source.")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Download bundled on-device vision models
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://storage.googleapis.com/mediapipe-models"
          DIR="$GITHUB_WORKSPACE/eve-project/app/src/main/assets/models"
          mkdir -p "$DIR"
          fetch() {
            local url="$1" out="$2" min_bytes="$3"
            curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 300 "$url" --output "$out"
            local bytes
            bytes=$(stat -c '%s' "$out")
            if [ "$bytes" -lt "$min_bytes" ]; then echo "Invalid/truncated model: $out ($bytes bytes)"; exit 1; fi
            sha256sum "$out"
          }
          fetch "$BASE/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite" "$DIR/objects.tflite" 1000000
          fetch "$BASE/face_landmarker/face_landmarker/float16/1/face_landmarker.task" "$DIR/face.task" 1000000
          fetch "$BASE/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task" "$DIR/gesture.task" 1000000
          fetch "$BASE/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite" "$DIR/embed.tflite" 1000000
          fetch "$BASE/image_classifier/efficientnet_lite0/int8/latest/efficientnet_lite0.tflite" "$DIR/classifier.tflite" 1000000
          fetch "$BASE/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" "$DIR/pose.task" 1000000
          echo "All six models downloaded and size-checked."
          ls -lh "$DIR"
      - name: Bundle on-device Arabic conversation model for first-run offline use
        shell: bash
        run: |
          set -euo pipefail
          URL="https://huggingface.co/litert-community/Qwen3-0.6B/resolve/a3c5d805ae362dff7f580bc25f2dfb9a5a7eaa76/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm"
          OUT="$GITHUB_WORKSPACE/eve-project/app/src/main/assets/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm"
          mkdir -p "$(dirname "$OUT")"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 --max-time 900 "$URL" --output "$OUT"
          BYTES="$(stat -c '%s' "$OUT")"
          if [ "$BYTES" -lt 300000000 ]; then echo "Invalid/truncated local language model: $BYTES bytes"; exit 1; fi
          echo "03e7da1eb1108b50dffaa9bb52cc7bcbad2eb0c66ca990267f480c1e545d2856  $OUT" | sha256sum --check
          echo "Verified pinned Qwen3-0.6B language model for offline first launch:"
          ls -lh "$OUT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: eve-project
        run: gradle assembleDebug --no-daemon
      - name: Verify models are inside the APK
        shell: bash
        run: |
          set -euo pipefail
          APK=eve-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          for f in objects.tflite face.task gesture.task embed.tflite classifier.tflite pose.task; do
            unzip -l "$APK" | grep -q "assets/models/$f" || { echo "Missing model asset inside APK: $f"; exit 1; }
          done
          unzip -l "$APK" | grep -q "assets/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm" || { echo "Missing bundled offline language model"; exit 1; }
          LANG_HASH="$(unzip -p "$APK" assets/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm | sha256sum | cut -d' ' -f1)"
          test "$LANG_HASH" = "03e7da1eb1108b50dffaa9bb52cc7bcbad2eb0c66ca990267f480c1e545d2856" || { echo "Bundled offline language model hash mismatch"; exit 1; }
          echo "Bundled offline language model verified inside APK."
          sha256sum "$APK"
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: EVE-Offline-Vision-APK
          path: eve-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
