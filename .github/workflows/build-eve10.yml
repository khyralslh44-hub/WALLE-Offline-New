name: Build original EVE Android ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - "eve-android (10).zip"
      - ".github/workflows/build-eve10.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the original project without adding assets
        run: |
          set -euo pipefail
          test -s "eve-android (10).zip"
          mkdir project
          unzip -q "eve-android (10).zip" -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          # Build-only Kotlin receiver fix; the uploaded ZIP remains untouched.
          sed -i 's/voice\.factor(style)/this@MainActivity.voice.factor(style)/' project/app/src/main/java/com/eve/companion/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: project
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EVE-Android-10-Original-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
