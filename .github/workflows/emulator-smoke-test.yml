name: WALL-E Emulator Smoke Test

concurrency:
  group: eve-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["EVE Android Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  emulator-test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # Avoid running CPU-heavy Android emulators at the same time.
      max-parallel: 1
      matrix:
        api-level: [29, 35]

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KVM device is available.'
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo 'KVM is unavailable; emulator may be slower.'
          fi

      - name: Find APK from the successful build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID_EVENT: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -n "${SOURCE_RUN_ID_EVENT}" ] && [ "${SOURCE_RUN_ID_EVENT}" != "null" ]; then
            RUN_ID="$SOURCE_RUN_ID_EVENT"
          else
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android-build.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful android-build.yml run was found."
            exit 1
          fi
          mkdir -p artifacts emulator-test-results
          echo "Downloading WALL-E-APK from run $RUN_ID"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name WALL-E-APK --dir artifacts
          APK_PATH="$(find "$GITHUB_WORKSPACE/artifacts" -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "No APK found inside the downloaded artifact."
            find artifacts -maxdepth 8 -type f -print
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "APK located: $APK_PATH"
          sha256sum "$APK_PATH" | tee emulator-test-results/apk-sha256.txt

      - name: Set up Java 17 for local face-model instrumentation
        if: ${{ matrix.api-level == 35 }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK test build tools
        if: ${{ matrix.api-level == 35 }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle 8.9 for instrumentation
        if: ${{ matrix.api-level == 35 }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://services.gradle.org/distributions/gradle-8.9-bin.zip" --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"

      - name: Download pinned portrait and FER model for offline instrumentation
        if: ${{ matrix.api-level == 35 }}
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="eve-project/app/src/androidTest/assets/face_fixture.jpg"
          MODEL="eve-project/app/src/main/assets/eve_emotion_model.tflite"
          mkdir -p "$(dirname "$FIXTURE")" "$(dirname "$MODEL")"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/googlesamples/mlkit/f1047837fe1e02d58063bfc30b830fad23ffbc35/ios/quickstarts/vision/Resources/grace_hopper.jpg" \
            --output "$FIXTURE"
          EXPECTED_FIXTURE="d2a427810f679db537236c5430873a81a62ef412"
          ACTUAL_FIXTURE="$(git hash-object "$FIXTURE")"
          if [ "$ACTUAL_FIXTURE" != "$EXPECTED_FIXTURE" ]; then
            echo "FAIL: portrait fixture hash mismatch: $ACTUAL_FIXTURE"
            exit 1
          fi
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/EnricoZanetti/moodstream/af59e5cdbd45936051a27e694b160996526f11bb/models/emotion_model.tflite" \
            --output "$MODEL"
          EXPECTED_MODEL="508da02d7ebad42e160ad4df0e946e2a16bf4c66"
          ACTUAL_MODEL="$(git hash-object "$MODEL")"
          if [ "$ACTUAL_MODEL" != "$EXPECTED_MODEL" ]; then
            echo "FAIL: FER model hash mismatch: $ACTUAL_MODEL"
            exit 1
          fi
          grep -Fq 'face_fixture.jpg' eve-project/app/src/androidTest/java/com/eve/robot/FaceVisionIntegrationTest.kt
          echo "PASS: pinned face fixture and FER model verified."
          sha256sum "$FIXTURE" "$MODEL" | tee "$RUNNER_TEMP/fer-input-sha256.txt"
          GESTURE_MODEL="eve-project/app/src/main/assets/gesture_recognizer.task"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/aa-del9/silent-speech/65249bd95a6f3467fbe67e175058f12cadbb9715/client/app/src/main/assets/gesture_recognizer.task" \
            --output "$GESTURE_MODEL"
          EXPECTED_GESTURE="33524de2b1595e3b755e50c0deaabd602af30085"
          ACTUAL_GESTURE="$(git hash-object "$GESTURE_MODEL")"
          test "$ACTUAL_GESTURE" = "$EXPECTED_GESTURE"
          echo "PASS: pinned hand-gesture model verified."
          sha256sum "$GESTURE_MODEL" | tee "$RUNNER_TEMP/gesture-model-sha256.txt"
          OBJECT_MODEL="eve-project/app/src/main/assets/efficientdet_lite0.tflite"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite" \
            --output "$OBJECT_MODEL"
          EXPECTED_OBJECT_SHA256="40338edf5ec70d43e318b0a716a84d4564cd1802759a7a07170c7e43796dbf58"
          ACTUAL_OBJECT_SHA256="$(sha256sum "$OBJECT_MODEL" | awk '{print $1}')"
          ACTUAL_OBJECT_BYTES="$(stat -c '%s' "$OBJECT_MODEL")"
          if [ "$ACTUAL_OBJECT_SHA256" != "$EXPECTED_OBJECT_SHA256" ] || [ "$ACTUAL_OBJECT_BYTES" -ne 13836895 ]; then
            echo "FAIL: EfficientDet-Lite0 object model digest/size mismatch."
            exit 1
          fi
          sha256sum "$OBJECT_MODEL" | tee "$RUNNER_TEMP/object-detector-sha256.txt"
          echo "PASS: pinned EfficientDet-Lite0 model verified."
          FACE_IDENTITY_MODEL="eve-project/app/src/main/assets/MobileFaceNet.tflite"
          FACE_IDENTITY_LICENSE="eve-project/app/src/main/assets/mobilefacenet_model_license.txt"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "https://raw.githubusercontent.com/syaringan357/Android-MobileFaceNet-MTCNN-FaceAntiSpoofing/d635649e711f5e16e6cd3dc06cbb329cd8d1d3b7/app/src/main/assets/MobileFaceNet.tflite" --output "$FACE_IDENTITY_MODEL"
          EXPECTED_FACE_IDENTITY_MODEL="3249c511be86366d5d0a137dc6f4af321af28678"
          ACTUAL_FACE_IDENTITY_MODEL="$(git hash-object "$FACE_IDENTITY_MODEL")"
          if [ "$ACTUAL_FACE_IDENTITY_MODEL" != "$EXPECTED_FACE_IDENTITY_MODEL" ]; then
            echo "FAIL: MobileFaceNet model SHA-1 mismatch: $ACTUAL_FACE_IDENTITY_MODEL"
            exit 1
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "https://raw.githubusercontent.com/syaringan357/Android-MobileFaceNet-MTCNN-FaceAntiSpoofing/d635649e711f5e16e6cd3dc06cbb329cd8d1d3b7/LICENSE" --output "$FACE_IDENTITY_LICENSE"
          grep -Fq "MIT License" "$FACE_IDENTITY_LICENSE"
          echo "PASS: offline face-identity model and MIT license verified."
          GESTURE_FIXTURE="eve-project/app/src/androidTest/assets/gesture_thumb_up.jpg"
          mkdir -p "$(dirname "$GESTURE_FIXTURE")"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/wgnrto/uniteye/0cbbc9bfbb0d0b0b95b57deec3095e5d5ac81996/com.github.homuler.mediapipe/Tests/Resources/thumb-up.jpg" \
            --output "$GESTURE_FIXTURE"
          EXPECTED_FIXTURE="781f7e5eb60c90201f6bb348a433bae5aee06da4"
          ACTUAL_FIXTURE="$(git hash-object "$GESTURE_FIXTURE")"
          test "$ACTUAL_FIXTURE" = "$EXPECTED_FIXTURE"
          grep -Fq 'gesture_thumb_up.jpg' eve-project/app/src/androidTest/java/com/eve/robot/HandGestureIntegrationTest.kt
          echo "PASS: pinned thumb-up gesture fixture verified."
          sha256sum "$GESTURE_FIXTURE" | tee "$RUNNER_TEMP/thumb-up-fixture-sha256.txt"

      - name: Download broad offline ImageNet classifier for API 35
        if: ${{ matrix.api-level == 35 }}
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/efficientnet_lite0_int8.tflite"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            "https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0/int8/latest/efficientnet_lite0.tflite" \
            --output "$MODEL"
          BYTES="$(stat -c '%s' "$MODEL")"
          SHA256="$(sha256sum "$MODEL" | awk '{print $1}')"
          EXPECTED_SHA256="bc2ffe19c1118de0c0c2a9088992da5589722656e0fba81421385300a4a34b16"
          EXPECTED_BYTES=5434517
          echo "EfficientNet-Lite0 ImageNet SHA-256: $SHA256"
          echo "EfficientNet-Lite0 ImageNet bytes: $BYTES"
          if [ "$SHA256" != "$EXPECTED_SHA256" ] || [ "$BYTES" -ne "$EXPECTED_BYTES" ]; then
            echo "FAIL: ImageNet classifier model differs from the reviewed pinned model."
            exit 1
          fi
          sha256sum "$MODEL" | tee "$RUNNER_TEMP/imagenet-classifier-sha256.txt"

      - name: Bundle fully offline Arabic speech recognition model for API 35
        if: ${{ matrix.api-level == 35 }}
        shell: bash
        run: bash .github/scripts/fetch-arabic-vosk-model.sh

      - name: Bundle and verify the pinned Qwen model for API 35 offline tests
        if: ${{ matrix.api-level == 35 }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="eve-project/app/src/main/assets"
          MODEL="$ASSETS/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm"
          mkdir -p "$ASSETS"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 --max-time 1200 \
            "https://huggingface.co/litert-community/Qwen3-0.6B/resolve/a3c5d805ae362dff7f580bc25f2dfb9a5a7eaa76/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm" \
            --output "$MODEL"
          EXPECTED="03e7da1eb1108b50dffaa9bb52cc7bcbad2eb0c66ca990267f480c1e545d2856"
          ACTUAL="$(sha256sum "$MODEL" | awk '{print $1}')"
          BYTES="$(stat -c '%s' "$MODEL")"
          echo "Qwen SHA-256: $ACTUAL"
          echo "Qwen model bytes: $BYTES"
          if [ "$ACTUAL" != "$EXPECTED" ] || [ "$BYTES" -lt 300000000 ]; then
            echo "FAIL: Qwen weights failed pinned digest/size verification."
            exit 1
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
            "https://huggingface.co/Qwen/Qwen3-0.6B/resolve/main/LICENSE" \
            --output "$ASSETS/qwen3_model_license.txt"
          grep -Fq "Apache License" "$ASSETS/qwen3_model_license.txt"
          cp eve-project/THIRD_PARTY_NOTICES.md "$ASSETS/THIRD_PARTY_NOTICES.txt"
          echo "PASS: exact pinned Qwen weights and license are present before instrumentation APK build."

      - name: Build matching app and instrumentation APKs with the same signing key
        if: ${{ matrix.api-level == 35 }}
        shell: bash
        run: |
          set -euo pipefail
          # Debug signing keys are generated per runner. The downloaded production APK was
          # signed on another runner, so it cannot be instrumented by this runner's test APK.
          # Build both APKs here so Android sees the same debug certificate on both packages.
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon --stacktrace -p eve-project testDebugUnitTest assembleDebug assembleDebugAndroidTest
          LOCAL_APK="$GITHUB_WORKSPACE/eve-project/app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="$GITHUB_WORKSPACE/eve-project/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -s "$LOCAL_APK"
          test -s "$TEST_APK"
          # Fail fast with clear evidence if the large offline model was omitted by Gradle.
          unzip -Z1 "$LOCAL_APK" > "$RUNNER_TEMP/eve-api35-app-apk-entries.txt"
          if ! grep -Fxq "assets/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm" "$RUNNER_TEMP/eve-api35-app-apk-entries.txt"; then
            echo "FAIL: API 35 local app APK is missing Qwen model weights."
            grep -Fi "Qwen2_0.5B_Instruct" "$RUNNER_TEMP/eve-api35-app-apk-entries.txt" || true
            exit 21
          fi
          PACKAGED_SHA256="$(unzip -p "$LOCAL_APK" assets/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm | sha256sum | awk '{print $1}')"
          EXPECTED_SHA256="03e7da1eb1108b50dffaa9bb52cc7bcbad2eb0c66ca990267f480c1e545d2856"
          if [ "$PACKAGED_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "FAIL: API 35 local app APK Qwen digest mismatch: $PACKAGED_SHA256"
            exit 22
          fi
          echo "PASS: API 35 APK contains the pinned Qwen asset (SHA-256 verified)."
          unzip -Z1 "$LOCAL_APK" > "$RUNNER_TEMP/eve-api35-vision-apk-entries.txt"
          if ! grep -Fxq "assets/efficientnet_lite0_int8.tflite" "$RUNNER_TEMP/eve-api35-vision-apk-entries.txt"; then
            echo "FAIL: API 35 local app APK is missing the broad ImageNet classifier."
            exit 23
          fi
          PACKAGED_IMAGENET_SHA256="$(unzip -p "$LOCAL_APK" assets/efficientnet_lite0_int8.tflite | sha256sum | awk '{print $1}')"
          SOURCE_IMAGENET_SHA256="$(sha256sum eve-project/app/src/main/assets/efficientnet_lite0_int8.tflite | awk '{print $1}')"
          if [ "$PACKAGED_IMAGENET_SHA256" != "$SOURCE_IMAGENET_SHA256" ]; then
            echo "FAIL: API 35 packaged ImageNet model hash mismatch."
            exit 24
          fi
          echo "PASS: API 35 APK contains the broad offline ImageNet classifier (SHA-256 verified)."
          echo "APK_PATH=$LOCAL_APK" >> "$GITHUB_ENV"
          echo "TEST_APK_PATH=$TEST_APK" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=local-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p emulator-test-results
          cp "$RUNNER_TEMP/fer-input-sha256.txt" emulator-test-results/fer-input-sha256.txt
          sha256sum "$LOCAL_APK" "$TEST_APK" | tee emulator-test-results/same-run-apk-sha256.txt
          echo "PASS: app and instrumentation APKs were built together using the same debug signing identity."

      - name: Install, launch, and interact with APK offline in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # ML Kit and TFLite models are bundled locally; Google Play Services are unnecessary.
          # The light AOSP image avoids unrelated GMS background ANRs during offline tests.
          target: default
          arch: x86_64
          profile: pixel_2
          # Explicitly expose both virtual lenses; otherwise the AOSP emulator may only
          # provide the rear camera and the camera-switch test cannot exercise FRONT.
          emulator-options: -no-window -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash "$GITHUB_WORKSPACE/.github/scripts/emulator-smoke-test.sh"
        env:
          TEST_API_LEVEL: ${{ matrix.api-level }}

      - name: Upload emulator logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WALL-E-Emulator-Report-API-${{ matrix.api-level }}
          path: emulator-test-results/
          if-no-files-found: warn
          retention-days: 14
