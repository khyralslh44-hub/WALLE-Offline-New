name: Test EVE incremental brain prototype

on:
  push:
    branches:
      - eve-incremental-brain-prototype
    paths:
      - "eve-model/experimental/**"
      - ".github/workflows/test-eve-incremental-brain.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: eve-model/requirements-training.txt
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run prototype tests
        working-directory: eve-model/experimental
        run: python -m unittest -v test_incremental_brain.py
      - name: Check training CLI
        working-directory: eve-model/experimental
        run: python train_incremental_core.py --help
      - name: Run tiny from-scratch CPU smoke training
        run: |
          mkdir -p /tmp/eve-corpus /tmp/eve-validation
          python -c "from pathlib import Path; Path('/tmp/eve-corpus/train.txt').write_text(('السلام عليكم يا إيف. تتعلم إيف من الملاحظة والتجربة وتراجع معرفتها. ') * 500, encoding='utf-8')"
          python -c "from pathlib import Path; Path('/tmp/eve-validation/valid.txt').write_text(('إيف تتعلم من التجربة وتراجع الملاحظة. ') * 100, encoding='utf-8')"
          python eve-model/experimental/train_incremental_core.py --corpus-dir /tmp/eve-corpus --output-dir /tmp/eve-smoke --steps 2 --seq-len 32 --batch-size 2 --hidden-size 16 --threads 2 --smoke-test
      - name: Evaluate on separate held-out text
        run: |
          python eve-model/experimental/evaluate_incremental_core.py --checkpoint /tmp/eve-smoke/eve-gru-smoke.pt --validation-dir /tmp/eve-validation --seq-len 32 --batch-size 2 --threads 2 --output /tmp/eve-smoke/validation-report.json
