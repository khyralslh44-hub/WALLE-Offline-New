name: Temporary inspect EVE v7 Android version
on:
  push:
    paths:
      - '.github/workflows/inspect-eve-version.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print Android version config
        run: |
          unzip -p "eve-android (7).zip" app/build.gradle.kts
