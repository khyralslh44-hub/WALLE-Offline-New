name: EVE Local LLM Offline Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'eve-project/app/src/main/java/com/eve/robot/LocalLanguageBrain.kt'
      - 'eve-project/app/src/androidTest/java/com/eve/robot/LocalLanguageBrainIntegrationTest.kt'
      - 'eve-project/app/build.gradle.kts'
      - 'eve-project/settings.gradle.kts'
      - 'eve-project/app/src/main/AndroidManifest.xml'
      - '.github/scripts/run-local-llm-test.sh'
      - '.github/workflows/eve-local-llm-verification.yml'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/emulator-smoke-test.yml'

permissions:
  contents: read

concurrency:
  # Keep each expensive 329 MB model-inference run tied to its exact source revision.
  # New commits must not silently cancel an in-progress diagnostic run.
  group: eve-local-llm-verification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  local-llm-offline:
    name: Real Qwen inference followed by offline engine reload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "FAIL: Android sdkmanager not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
            --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"

      - name: Bundle and verify Qwen weights before building the app
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$RUNNER_TEMP/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm"
          EXPECTED="03e7da1eb1108b50dffaa9bb52cc7bcbad2eb0c66ca990267f480c1e545d2856"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 --max-time 1200 \
            "https://huggingface.co/litert-community/Qwen3-0.6B/resolve/a3c5d805ae362dff7f580bc25f2dfb9a5a7eaa76/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm" \
            --output "$MODEL"
          ACTUAL="$(sha256sum "$MODEL" | awk '{print $1}')"
          BYTES="$(stat -c '%s' "$MODEL")"
          echo "Qwen model SHA-256: $ACTUAL"
          echo "Qwen model bytes: $BYTES"
          if [ "$ACTUAL" != "$EXPECTED" ] || [ "$BYTES" -lt 300000000 ]; then
            echo "FAIL: pinned Qwen weights failed digest/size verification."
            exit 1
          fi
          sha256sum "$MODEL" | tee "$RUNNER_TEMP/qwen-model-sha256.txt"
          ASSETS="eve-project/app/src/main/assets"
          mkdir -p "$ASSETS"
          cp "$MODEL" "$ASSETS/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
            "https://huggingface.co/Qwen/Qwen3-0.6B/resolve/main/LICENSE" \
            --output "$ASSETS/qwen3_model_license.txt"
          grep -Fq "Apache License" "$ASSETS/qwen3_model_license.txt"
          cp eve-project/THIRD_PARTY_NOTICES.md "$ASSETS/THIRD_PARTY_NOTICES.txt"
          cat >> "$ASSETS/THIRD_PARTY_NOTICES.txt" <<'NOTICE'

          ## Qwen3-0.6B language model

          The bundled Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm weights are the LiteRT-LM conversion
          of Qwen/Qwen3-0.6B from litert-community/Qwen3-0.6B.
          The upstream model is licensed under Apache License 2.0; the full license is
          included in qwen3_model_license.txt in this APK's assets.
          NOTICE
          echo "PASS: Qwen weights verified and copied into APK assets before compilation."

      - name: Build app and the dedicated language-model instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          # The pinned Qwen weights are embedded in the APK assets for offline first-run setup.
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon --stacktrace -p eve-project \
            testDebugUnitTest assembleDebug assembleDebugAndroidTest
          APP_APK="eve-project/app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="eve-project/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -s "$APP_APK"
          test -s "$TEST_APK"
          # Verify the exact output APK before spending 20+ minutes booting the emulator.
          # Persist ZIP entries first to avoid pipefail/SIGPIPE false negatives from grep -q.
          unzip -Z1 "$APP_APK" > "$RUNNER_TEMP/eve-app-apk-entries.txt"
          if ! grep -Fxq "assets/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm" "$RUNNER_TEMP/eve-app-apk-entries.txt"; then
            echo "FAIL: build output app-debug.apk is missing the Qwen asset."
            grep -Fi "Qwen3-0.6B_dynamic_wi4b32_afp32" "$RUNNER_TEMP/eve-app-apk-entries.txt" || true
            exit 21
          fi
          PACKAGED_SHA256="$(unzip -p "$APP_APK" assets/Qwen3-0.6B_dynamic_wi4b32_afp32.litertlm | sha256sum | awk '{print $1}')"
          EXPECTED_SHA256="03e7da1eb1108b50dffaa9bb52cc7bcbad2eb0c66ca990267f480c1e545d2856"
          if [ "$PACKAGED_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "FAIL: APK Qwen model digest mismatch: $PACKAGED_SHA256"
            exit 22
          fi
          echo "PASS: APK contains the pinned Qwen asset (SHA-256 verified)."
          sha256sum "$APP_APK" "$TEST_APK" | tee "$RUNNER_TEMP/eve-llm-apk-sha256.txt"

      - name: Run real local model test on Android API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 35 is already installed and verified by the preceding SDK step. Keep the
          # long 329 MB inference test off the flaky API 29 platform download path; the
          # separate emulator smoke workflow still checks compatibility on API 29.
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/run-local-llm-test.sh"

      - name: Upload local LLM inference proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Local-LLM-Offline-Proof
          path: |
            eve-llm-results/**
            eve-project/app/build/reports/tests/testDebugUnitTest/**
            eve-project/app/build/test-results/testDebugUnitTest/**
            eve-project/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
