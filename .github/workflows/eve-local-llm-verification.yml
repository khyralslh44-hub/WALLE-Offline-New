name: EVE Bespoke Compact Arabic Brain Offline Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'eve-project/app/src/main/java/com/eve/robot/LocalLanguageBrain.kt'
      - 'eve-project/app/src/main/java/com/eve/robot/LibyanSentimentModel.kt'
      - 'eve-project/app/src/main/java/com/eve/robot/EveTinyArabicBrain.kt'
      - '.github/scripts/train_libyan_sentiment.py'
      - 'eve-project/app/src/main/java/com/eve/robot/EveTinyArabicBrain.kt'
      - 'eve-project/app/src/main/java/com/eve/robot/EveArabicSemanticComposer.kt'
      - 'eve-project/app/src/main/java/com/eve/robot/EveArabicTextUnderstanding.kt'
      - 'eve-project/app/src/test/java/com/eve/robot/EveTinyArabicBrainTest.kt'
      - 'eve-project/app/src/androidTest/java/com/eve/robot/LocalLanguageBrainIntegrationTest.kt'
      - 'eve-project/app/build.gradle.kts'
      - 'EVE_COMPACT_ARABIC_BRAIN.md'
      - 'eve-project/app/src/main/AndroidManifest.xml'
      - '.github/scripts/run-local-llm-test.sh'
      - '.github/workflows/eve-local-llm-verification.yml'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: eve-compact-arabic-verification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tiny-arabic-offline:
    name: EVE bespoke Arabic dialogue engine on Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "FAIL: Android sdkmanager not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
            --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"

      - name: Train compact Libyan Arabic review model
        shell: bash
        run: |
          set -euo pipefail
          DATASET="$RUNNER_TEMP/libyan-restaurant-reviews.xlsx"
          ASSETS="eve-project/app/src/main/assets"
          mkdir -p "$ASSETS"
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 180 \
            "https://raw.githubusercontent.com/Mansour-Essgaer/Libyan-Resturant/a8b5cc1dfa2137caee565646428acc10f1d4b629/Libyan%20Resturant.xlsx" \
            --output "$DATASET"
          test "$(git hash-object "$DATASET")" = "3ba9c7ab2a17077aa01427eca54731eee6dda0b6"
          python3 .github/scripts/train_libyan_sentiment.py \
            --input "$DATASET" \
            --output "$ASSETS/libyan_sentiment_nb.tsv" \
            --report "$RUNNER_TEMP/libyan-sentiment-report.json"
          test -s "$ASSETS/libyan_sentiment_nb.tsv"
          test "$(head -n 1 "$ASSETS/libyan_sentiment_nb.tsv")" = "EVE_LIBYAN_SENTIMENT_V1"

      - name: Run unit tests and build compact app/instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon --stacktrace -p eve-project \
            testDebugUnitTest assembleDebug assembleDebugAndroidTest
          test -s eve-project/app/build/outputs/apk/debug/app-debug.apk
          test -s eve-project/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          APP_APK=eve-project/app/build/outputs/apk/debug/app-debug.apk
          if unzip -Z1 "$APP_APK" | grep -Eiq 'Qwen|litertlm|[.]gguf$'; then
            echo "FAIL: model weights are not expected in this fallback-only test APK."
            exit 2
          fi
          echo "PASS: fallback-only APK has no GGUF weights; llama.cpp runtime library is permitted."

      - name: Run Android emulator test with radios disabled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/run-local-llm-test.sh"

      - name: Upload local dialogue verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Local-Dialogue-Offline-Proof
          path: |
            eve-tiny-results/**
            eve-project/app/build/reports/tests/testDebugUnitTest/**
            eve-project/app/build/test-results/testDebugUnitTest/**
            eve-project/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
