name: Russian Step by Step Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'russian-step/**'
      - '.github/workflows/russian-step-build.yml'

permissions:
  contents: read

concurrency:
  group: russian-step-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate offline Russian tutor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://services.gradle.org/distributions/gradle-8.9-bin.zip" --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

      - name: Run Android build and tests
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon --stacktrace -p russian-step testDebugUnitTest assembleDebug

      - name: Verify APK and offline-only manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="russian-step/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools/35.0.0" -type f -name aapt -print -quit)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools/35.0.0" -type f -name apksigner -print -quit)"
          "$AAPT" dump permissions "$APK" | tee "$RUNNER_TEMP/apk-permissions.txt"
          if grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/apk-permissions.txt"; then
            echo "FAIL: this app must not request internet access."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk-sha256.txt"
          echo "PASS: APK builds, signature verifies, and INTERNET permission is absent."

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Russian-Step-APK
          path: russian-step/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK validation checksum
        uses: actions/upload-artifact@v4
        with:
          name: Russian-Step-Build-Report
          path: ${{ runner.temp }}/apk-sha256.txt
          if-no-files-found: warn
          retention-days: 30
