name: EVE Lahgtna Libyan Pilot

on:
  push:
    paths:
      - ".github/workflows/eve-lahgtna-libyan-pilot.yml"
      - ".github/scripts/probe-lahgtna-libyan.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libyan-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pilot tools
        run: python -m pip install --disable-pip-version-check vosk==0.3.45 datasets==3.6.0 librosa soundfile
      - name: Download verified Vosk Arabic teacher model
        run: bash .github/scripts/fetch-arabic-vosk-model.sh "$RUNNER_TEMP/eve-vosk-teacher"
      - name: Extract teacher model
        run: |
          mkdir -p "$RUNNER_TEMP/eve-vosk-model"
          unzip -q "$RUNNER_TEMP/eve-vosk-teacher/vosk-model-ar-mgb2-0.4.zip" -d "$RUNNER_TEMP/eve-vosk-model"
          MODEL_DIR="$(find "$RUNNER_TEMP/eve-vosk-model" -type f -path '*/am/final.mdl' -printf '%h\n' | sed 's#/am$##' | head -n1)"
          test -n "$MODEL_DIR"
          echo "VOSK_MODEL_DIR=$MODEL_DIR" >> "$GITHUB_ENV"
      - name: Probe 30 Libyan train and 30 test clips
        run: python .github/scripts/probe-lahgtna-libyan.py "$VOSK_MODEL_DIR"
