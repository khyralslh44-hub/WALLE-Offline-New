name: Compare EVE Android archives

on:
  push:
    paths:
      - '.github/workflows/compare-eve-archives.yml'
      - 'eve-android (6).zip'
      - 'eve-android (7).zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare archive contents
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, difflib, os
          a_path = 'eve-android (6).zip'
          b_path = 'eve-android (7).zip'
          with zipfile.ZipFile(a_path) as a, zipfile.ZipFile(b_path) as b:
              A = {i.filename: a.read(i.filename) for i in a.infolist() if not i.is_dir()}
              B = {i.filename: b.read(i.filename) for i in b.infolist() if not i.is_dir()}
          added = sorted(B.keys() - A.keys())
          removed = sorted(A.keys() - B.keys())
          changed = sorted(k for k in A.keys() & B.keys() if A[k] != B[k])
          print(f'ARCHIVE 6: {len(A)} files')
          print(f'ARCHIVE 7: {len(B)} files')
          print(f'ADDED: {len(added)}')
          for x in added: print('  +', x)
          print(f'REMOVED: {len(removed)}')
          for x in removed: print('  -', x)
          print(f'CHANGED: {len(changed)}')
          for x in changed: print('  *', x, f'({len(A[x])} -> {len(B[x])} bytes)')
          text_ext = ('.kt','.java','.xml','.gradle','.kts','.md','.html','.json','.properties','.yml','.yaml','.txt')
          for x in changed:
              if not x.lower().endswith(text_ext): continue
              try:
                  old=A[x].decode('utf-8').splitlines()
                  new=B[x].decode('utf-8').splitlines()
              except UnicodeDecodeError:
                  continue
              diff=list(difflib.unified_diff(old,new,fromfile='v6/'+x,tofile='v7/'+x,n=3))
              if diff:
                  print('\\n===== TEXT DIFF:',x,'=====')
                  for line in diff[:180]: print(line)
                  if len(diff)>180: print(f'... diff truncated; {len(diff)} lines total')
          PY
