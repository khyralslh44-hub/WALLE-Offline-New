# Restart requested on 2026-11-12: trigger a fresh build without changing build behavior.
name: Build EVE Android 10 APK

on:
  push:
    branches:
      - build/eve-android-10-original
    paths:
      - ".github/workflows/build-eve10-apk.yml"
      - "eve-android (10).zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact original archive
        uses: actions/checkout@v4
        with:
          ref: build/eve-android-10-original

      - name: Verify, preserve, and extract original archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="eve-android (10).zip"
          test -s "$ARCHIVE"
          mkdir -p source
          unzip -t "$ARCHIVE"
          unzip -q "$ARCHIVE" -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

          # Keep the complete original ZIP byte-for-byte inside the APK assets.
          mkdir -p source/app/src/main/assets/original
          cp "$ARCHIVE" source/app/src/main/assets/original/eve-android-10-original.zip

          # Keep a readable inventory of every entry in the supplied archive.
          unzip -Z1 "$ARCHIVE" > source/app/src/main/assets/original/archive-file-list.txt
          sha256sum "$ARCHIVE" | awk '{print $1}' > source/app/src/main/assets/original/archive-sha256.txt

          echo "Original archive SHA-256:"
          sha256sum "$ARCHIVE"
          echo "Original archive entries: $(wc -l < source/app/src/main/assets/original/archive-file-list.txt)"
          echo "Extracted source tree (first 100 files):"
          find source -maxdepth 3 -type f | sort | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Diagnose original Kotlin compile error
        shell: bash
        run: |
          echo "MainActivity.kt lines 68-88:"
          nl -ba source/app/src/main/java/com/eve/companion/MainActivity.kt | sed -n "68,88p"

      - name: Inspect original voice implementation
        shell: bash
        run: |
          echo "=== EveVoice.kt ==="
          sed -n '1,180p' source/app/src/main/java/com/eve/companion/EveVoice.kt
          echo "=== MainActivity.kt relevant class structure ==="
          nl -ba source/app/src/main/java/com/eve/companion/MainActivity.kt | sed -n "1,115p"
          echo "=== All voice declarations ==="
          grep -RIn --include='*.kt' -E 'val voice|var voice|voice[[:space:]]*=' source/app/src/main/java || true

      - name: Fix Android TextToSpeech receiver name resolution in extracted build copy
        shell: bash
        run: |
          set -euo pipefail
          FILE="source/app/src/main/java/com/eve/companion/MainActivity.kt"
          grep -q 'voice.factor(style)' "$FILE"
          sed -i 's/voice\.factor(style)/this@MainActivity.voice.factor(style)/' "$FILE"
          grep -q 'this@MainActivity.voice.factor(style)' "$FILE"
          echo "Applied one compile-only receiver qualification to extracted build source."
          echo "The original ZIP and its embedded byte-for-byte copy remain unchanged."

      - name: Download the five on-device vision model assets required by Vision.kt
        shell: bash
        run: |
          set -euo pipefail
          B="https://storage.googleapis.com/mediapipe-models"
          D="source/app/src/main/assets/models"
          mkdir -p "$D"
          curl -fL "$B/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite" -o "$D/objects.tflite"
          curl -fL "$B/face_landmarker/face_landmarker/float16/1/face_landmarker.task" -o "$D/face.task"
          curl -fL "$B/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task" -o "$D/gesture.task"
          curl -fL "$B/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite" -o "$D/embed.tflite"
          curl -fL "$B/image_classifier/efficientnet_lite0/float32/1/efficientnet_lite0.tflite" -o "$D/classify.tflite"
          for f in objects.tflite face.task gesture.task embed.tflite classify.tflite; do
            test -s "$D/$f"
            printf '%s  ' "$f"
            sha256sum "$D/$f" | awk '{print $1}'
          done
          ls -lh "$D"

      - name: Build debug APK from preserved original source
        working-directory: source
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and byte-for-byte archive preservation
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find source/app/build/outputs/apk -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/EVE-Android-10.apk

          unzip -t dist/EVE-Android-10.apk
          echo "Checking all five packaged vision models:"
          for model in objects.tflite face.task gesture.task embed.tflite classify.tflite; do
            unzip -p dist/EVE-Android-10.apk "assets/models/$model" > "dist/$model"
            test -s "dist/$model"
            printf '%s  ' "$model"
            sha256sum "dist/$model" | awk '{print $1}'
            rm "dist/$model"
          done
          unzip -p dist/EVE-Android-10.apk assets/original/eve-android-10-original.zip > dist/extracted-original.zip
          cmp "eve-android (10).zip" dist/extracted-original.zip
          unzip -p dist/EVE-Android-10.apk assets/original/archive-file-list.txt | cmp - source/app/src/main/assets/original/archive-file-list.txt
          unzip -p dist/EVE-Android-10.apk assets/original/archive-sha256.txt | cmp - source/app/src/main/assets/original/archive-sha256.txt

          echo "PASS: complete original ZIP is embedded byte-for-byte in the APK."
          echo "PASS: archive inventory and SHA-256 metadata are embedded."
          rm dist/extracted-original.zip
          ls -lh dist/EVE-Android-10.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Android-10-APK
          path: dist/EVE-Android-10.apk
          if-no-files-found: error
          retention-days: 30
