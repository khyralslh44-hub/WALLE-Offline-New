name: Build EVE Android 10 APK

on:
  push:
    branches:
      - build/eve-android-10-original
    paths:
      - ".github/workflows/build-eve10-apk.yml"
      - "eve-android (10).zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact original archive
        uses: actions/checkout@v4
        with:
          ref: build/eve-android-10-original

      - name: Verify and extract original archive
        run: |
          test -s "eve-android (10).zip"
          mkdir -p source
          unzip -q "eve-android (10).zip" -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts
          echo "Original archive extracted; source tree:"
          find source -maxdepth 3 -type f | sort | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK from original source
        working-directory: source
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: |
          APK="$(find source/app/build/outputs/apk -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/EVE-Android-10.apk
          ls -lh dist/EVE-Android-10.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Android-10-APK
          path: dist/EVE-Android-10.apk
          if-no-files-found: error
          retention-days: 30
