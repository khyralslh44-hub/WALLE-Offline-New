# Restart requested on 2026-11-12: trigger a fresh build without changing build behavior.
name: Build EVE Android 10 APK

on:
  push:
    branches:
      - build/eve-android-10-original
    paths:
      - ".github/workflows/build-eve10-apk.yml"
      - "eve-android (10).zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact original archive
        uses: actions/checkout@v4
        with:
          ref: build/eve-android-10-original

      - name: Verify, preserve, and extract original archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="eve-android (10).zip"
          test -s "$ARCHIVE"
          mkdir -p source
          unzip -t "$ARCHIVE"
          unzip -q "$ARCHIVE" -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

          # Keep the complete original ZIP byte-for-byte inside the APK assets.
          mkdir -p source/app/src/main/assets/original
          cp "$ARCHIVE" source/app/src/main/assets/original/eve-android-10-original.zip

          # Keep a readable inventory of every entry in the supplied archive.
          unzip -Z1 "$ARCHIVE" > source/app/src/main/assets/original/archive-file-list.txt
          sha256sum "$ARCHIVE" | awk '{print $1}' > source/app/src/main/assets/original/archive-sha256.txt

          echo "Original archive SHA-256:"
          sha256sum "$ARCHIVE"
          echo "Original archive entries: $(wc -l < source/app/src/main/assets/original/archive-file-list.txt)"
          echo "Extracted source tree (first 100 files):"
          find source -maxdepth 3 -type f | sort | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Diagnose original Kotlin compile error
        shell: bash
        run: |
          echo "MainActivity.kt lines 68-88:"
          nl -ba source/app/src/main/java/com/eve/companion/MainActivity.kt | sed -n "68,88p"

      - name: Build debug APK from preserved original source
        working-directory: source
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and byte-for-byte archive preservation
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find source/app/build/outputs/apk -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/EVE-Android-10.apk

          unzip -t dist/EVE-Android-10.apk
          unzip -p dist/EVE-Android-10.apk assets/original/eve-android-10-original.zip > dist/extracted-original.zip
          cmp "eve-android (10).zip" dist/extracted-original.zip
          unzip -p dist/EVE-Android-10.apk assets/original/archive-file-list.txt | cmp - source/app/src/main/assets/original/archive-file-list.txt
          unzip -p dist/EVE-Android-10.apk assets/original/archive-sha256.txt | cmp - source/app/src/main/assets/original/archive-sha256.txt

          echo "PASS: complete original ZIP is embedded byte-for-byte in the APK."
          echo "PASS: archive inventory and SHA-256 metadata are embedded."
          rm dist/extracted-original.zip
          ls -lh dist/EVE-Android-10.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Android-10-APK
          path: dist/EVE-Android-10.apk
          if-no-files-found: error
          retention-days: 30
