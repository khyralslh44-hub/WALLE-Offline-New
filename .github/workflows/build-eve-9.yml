name: Build uploaded EVE Android ZIP (9)

on:
  workflow_dispatch:
  push:
    paths:
      - 'eve-android (9).zip'
      - '.github/scripts/eve-offline-ear.py'
      - '.github/scripts/harden-eve-vision.py'
      - '.github/scripts/eve-core-memory.py'
      - '.github/scripts/eve-memory-core.py'
      - '.github/scripts/eve-closed-loop.py'
      - '.github/scripts/eve-cognitive-architecture.py'
      - '.github/scripts/prepare-eve-standalone.py'
      - '.github/scripts/eve-41-polish.py'
      - '.github/scripts/eve-50-core.py'
      - '.github/workflows/build-eve-9.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build installable EVE APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract and validate uploaded project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/eve-android (9).zip"
          SRC="$RUNNER_TEMP/eve-src"
          test -s "$ARCHIVE"
          mkdir -p "$SRC"
          unzip -q "$ARCHIVE" -d "$SRC"
          test -s "$SRC/settings.gradle.kts"
          test -s "$SRC/build.gradle.kts"
          test -s "$SRC/app/build.gradle.kts"
          test -s "$SRC/app/src/main/AndroidManifest.xml"
          test -s "$SRC/app/src/main/assets/eve.html"
          test -s "$SRC/app/src/main/java/com/eve/companion/MainActivity.kt"
          if grep -Eq 'uses-permission[^>]*android.permission.INTERNET' "$SRC/app/src/main/AndroidManifest.xml"; then
            echo "ERROR: internet permission found in this offline app's manifest."
            exit 1
          fi
          echo "Validated project source at $SRC"
          echo "EVE app source ZIP: $(du -h "$ARCHIVE" | cut -f1)"

      - name: Install strict on-device Arabic speech path
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/eve-src"
          python3 "$GITHUB_WORKSPACE/.github/scripts/eve-offline-ear.py" "$SRC/app/src/main/java/com/eve/companion/Speech.kt"
          grep -q 'createOnDeviceSpeechRecognizer(ctx)' "$SRC/app/src/main/java/com/eve/companion/Speech.kt"
          grep -q 'isOnDeviceRecognitionAvailable(ctx)' "$SRC/app/src/main/java/com/eve/companion/Speech.kt"
          ! grep -q 'createSpeechRecognizer(ctx)' "$SRC/app/src/main/java/com/eve/companion/Speech.kt"

      - name: Set standalone package identity and launcher icon
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/eve-src"
          python3 "$GITHUB_WORKSPACE/.github/scripts/prepare-eve-standalone.py" "$SRC"

      - name: Apply conservative temporal vision gate
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/eve-src"
          python3 "$GITHUB_WORKSPACE/.github/scripts/harden-eve-vision.py" "$SRC/app/src/main/assets/eve.html"

      - name: Add verified offline object learning
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/eve-src"
          python3 "$GITHUB_WORKSPACE/.github/scripts/eve-core-memory.py" "$SRC/app/src/main/assets/eve.html"

      - name: Add central decision stability and weighted memory
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/eve-src"
          python3 "$GITHUB_WORKSPACE/.github/scripts/eve-memory-core.py" "$SRC/app/src/main/assets/eve.html"
          python3 "$GITHUB_WORKSPACE/.github/scripts/eve-closed-loop.py" "$SRC/app/src/main/assets/eve.html"
          python3 "$GITHUB_WORKSPACE/.github/scripts/eve-cognitive-architecture.py" "$SRC/app/src/main/assets/eve.html"
          python3 - "$SRC/app/src/main/assets/eve.html" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text(encoding="utf-8")
          blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S)
          js=[b for b in blocks if len(b)>1000 and not b.lstrip().startswith('{"E":')]
          if len(js)!=1: raise SystemExit(f"Expected one app JS block, found {len(js)}")
          Path("/tmp/eve-app-check.js").write_text(js[0],encoding="utf-8")
          PY
          node --check /tmp/eve-app-check.js

      - name: Add EVE 4.1 expressive polish and Redmi performance tuning
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/eve-src"
          python3 "$GITHUB_WORKSPACE/.github/scripts/eve-41-polish.py" "$SRC"
          python3 - "$SRC/app/src/main/assets/eve.html" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text(encoding="utf-8")
          blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S)
          js=[b for b in blocks if len(b)>1000 and not b.lstrip().startswith('{"E":')]
          if len(js)!=1: raise SystemExit(f"Expected one app JS block, found {len(js)}")
          Path("/tmp/eve-app-check-41.js").write_text(js[0],encoding="utf-8")
          PY
          node --check /tmp/eve-app-check-41.js

      - name: Add EVE 5.0 long-term memory and uncertainty-aware decisions
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/eve-src"
          python3 "$GITHUB_WORKSPACE/.github/scripts/eve-50-core.py" "$SRC"
          python3 - "$SRC/app/src/main/assets/eve.html" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text(encoding="utf-8")
          blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S)
          js=[b for b in blocks if len(b)>1000 and not b.lstrip().startswith('{"E":')]
          if len(js)!=1: raise SystemExit(f"Expected one app JS block, found {len(js)}")
          Path("/tmp/eve-app-check-50.js").write_text(js[0],encoding="utf-8")
          PY
          node --check /tmp/eve-app-check-50.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Download required offline vision models (build time only)
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/eve-src"
          BASE="https://storage.googleapis.com/mediapipe-models"
          DEST="$SRC/app/src/main/assets/models"
          mkdir -p "$DEST"
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 240 "$BASE/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite" --output "$DEST/objects.tflite"
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 240 "$BASE/face_landmarker/face_landmarker/float16/1/face_landmarker.task" --output "$DEST/face.task"
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 240 "$BASE/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task" --output "$DEST/gesture.task"
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 240 "$BASE/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite" --output "$DEST/embed.tflite"
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 240 "$BASE/image_classifier/efficientnet_lite0/float32/1/efficientnet_lite0.tflite" --output "$DEST/classify.tflite"
          for f in objects.tflite face.task gesture.task embed.tflite classify.tflite; do
            test -s "$DEST/$f"
            echo "$f: $(stat -c '%s' "$DEST/$f") bytes"
          done

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/eve-src"
          python3 - "$SRC/app/src/main/java/com/eve/companion/MainActivity.kt" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          source = p.read_text(encoding="utf-8")
          target = "voice.factor(style)"
          if target in source and "private fun voiceFactor(" not in source:
              bridge = "    inner class Bridge {"
              if bridge not in source:
                  raise SystemExit("Could not find Bridge insertion point for targeted compatibility fix.")
              helper = (
                  "    private fun voiceFactor(style: String): Float = when (style.lowercase()) {\n"
                  '        "angry", "annoyed", "frustrated" -> 1.08f\n'
                  '        "sad", "sleepy", "calm" -> 0.92f\n'
                  '        "fear", "surprised", "excited" -> 1.05f\n'
                  "        else -> 1.0f\n"
                  "    }\n\n"
              )
              source = source.replace(bridge, helper + bridge, 1).replace(target, "voiceFactor(style)")
              p.write_text(source, encoding="utf-8")
          PY
          gradle --no-daemon --stacktrace -p "$SRC" testDebugUnitTest assembleDebug

      - name: Verify installable APK, standalone package and launcher icon
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/eve-src/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING"
          [[ "$BADGING" == *"name='com.eve.companion.standalone'"* ]]
          [[ "$BADGING" == *"versionCode='6'"* ]]
          [[ "$BADGING" == *"versionName='4.1'"* ]]
          RESOURCES="$("$AAPT" dump resources "$APK")"
          [[ "$RESOURCES" == *"mipmap/ic_launcher"* ]]
          [[ "$RESOURCES" == *"drawable/ic_eve_foreground"* ]]
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-files.txt"
          for f in objects.tflite face.task gesture.task embed.tflite classify.tflite; do
            grep -Fxq "assets/models/$f" "$RUNNER_TEMP/apk-files.txt"
          done
          echo "APK_SIZE=$(du -h "$APK" | cut -f1)" >> "$GITHUB_ENV"
          echo "PASS: standalone package ID/version, launcher icon resources, APK signature, and all 5 offline vision models verified."

      - name: Publish build result summary
        if: always()
        shell: bash
        run: |
          {
            echo "## EVE APK build"
            echo ""
            echo "- Source: eve-android (9).zip"
            echo "- Package: com.eve.companion.standalone (side-by-side install; previous EVE is preserved)"
            echo "- Launcher label: EVE 4.1"
            echo "- Target: Android / Redmi 12 compatible configuration"
            echo "- Internet permission in source manifest: not declared"
            if [ -n "${APK_SIZE:-}" ]; then echo "- APK size: $APK_SIZE"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Eve-APK
          path: ${{ runner.temp }}/eve-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
