name: Train EVE private language model

on:
  workflow_dispatch:
    inputs:
      examples:
        description: Number of Arabic distillation examples (runner uses a local open model)
        required: true
        default: "1000"
      workers:
        description: Teacher workers (local CPU inference is safest at 1)
        required: true
        default: "1"
      batch_size:
        description: Examples per resumable checkpointed batch
        required: true
        default: "50"
  push:
    branches:
      - main
      - feature/eve-free-open-teacher-distillation
    paths:
      - 'eve-model/train_private_eve_student.py'
      - 'eve-model/README.md'
      - '.github/workflows/train-eve-private-model.yml'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore saved corpus and training checkpoints
        uses: actions/cache@v4
        with:
          path: |
            eve-model/teacher_corpus.jsonl
            eve-model/teacher_corpus.progress.json
            eve-model/dist/training_checkpoint.keras
            eve-model/.teacher_cache/
          key: eve-language-training-open-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            eve-language-training-open-v2-
      - name: Install CPU llama.cpp build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopenblas-dev
      - name: Install free local-teacher and student-training dependencies
        env:
          CMAKE_ARGS: "-DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS -DGGML_NATIVE=OFF"
          FORCE_CMAKE: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install "llama-cpp-python==0.3.36" "huggingface_hub>=0.26,<2" "tensorflow-cpu==2.16.1" numpy
      - name: Distil EVE from the local open-weight Qwen3 teacher and train the compact student
        env:
          EVE_TRAIN_EXAMPLES: ${{ inputs.examples || '1000' }}
          EVE_TEACHER_WORKERS: ${{ inputs.workers || '1' }}
          EVE_TEACHER_BATCH_SIZE: ${{ inputs.batch_size || '50' }}
          EVE_TEACHER_THREADS: "4"
        run: |
          set -euo pipefail
          python -m py_compile eve-model/train_private_eve_student.py
          python eve-model/train_private_eve_student.py
      - name: Upload EVE model, resumable corpus and training report
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Private-Student-TFLite
          path: |
            eve-model/dist/eve_private_student.tflite
            eve-model/dist/eve_private_student.json
            eve-model/dist/training_checkpoint.keras
            eve-model/dist/training_report.json
            eve-model/teacher_corpus.jsonl
            eve-model/teacher_corpus.progress.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish the distilled student as a single APK asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Student-APK-Asset
          path: eve-model/dist/eve_private_student.tflite
          if-no-files-found: error
          retention-days: 30

      - name: Publish the compact distilled student for embedding in the APK
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="eve-private-student"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "EVE Distilled Arabic Student" \
              --notes "Compact EVE-GRU-256-2L student trained from local sequence-level targets generated by the Apache-2.0 Qwen3-0.6B open-weight teacher. The large teacher is training-only and is not included in the Android app."
          fi
          gh release upload "$TAG" eve-model/dist/eve_private_student.tflite eve-model/dist/eve_private_student.json --clobber
