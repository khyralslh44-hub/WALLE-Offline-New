name: Build RusStep Android APK

on:
  push:
    branches: ["russtep-build"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore offline lesson page and embedded Russian audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p russtep_project/app/src/main/assets
          cat russtep_html/part-*.txt > russtep_project/app/src/main/assets/index.html
          test "$(wc -c < russtep_project/app/src/main/assets/index.html)" -gt 1000000
          grep -q "embeddedAudioData" russtep_project/app/src/main/assets/index.html
          echo "Restored the single-file offline page with embedded Russian audio."

      - name: Build debug APK
        working-directory: russtep_project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK file
        shell: bash
        run: |
          set -euo pipefail
          APK="russtep_project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RusStep-Offline-APK
          path: russtep_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
