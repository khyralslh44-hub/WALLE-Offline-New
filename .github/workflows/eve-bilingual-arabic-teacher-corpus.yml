name: EVE Bilingual Arabic Teacher Corpus

on:
  workflow_dispatch:
    inputs:
      train_limit:
        description: "Maximum Common Voice Arabic training clips"
        required: true
        default: "240"
      eval_limit:
        description: "Maximum clips per independent validation/test split"
        required: true
        default: "80"
      max_wer:
        description: "Maximum teacher WER for accepted training clips"
        required: true
        default: "0.55"
  push:
    paths:
      - ".github/scripts/prepare-eve-bilingual-teacher-corpus.py"
      - ".github/workflows/eve-bilingual-arabic-teacher-corpus.yml"

permissions:
  contents: read

jobs:
  prepare-bilingual-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install corpus tools
        run: python -m pip install --disable-pip-version-check vosk==0.3.45 datasets==3.6.0 librosa soundfile
      - name: Download and verify Vosk Arabic teacher model
        run: bash .github/scripts/fetch-arabic-vosk-model.sh "$RUNNER_TEMP/eve-vosk-teacher"
      - name: Extract verified model
        run: |
          mkdir -p "$RUNNER_TEMP/eve-vosk-model"
          unzip -q "$RUNNER_TEMP/eve-vosk-teacher/vosk-model-ar-mgb2-0.4.zip" -d "$RUNNER_TEMP/eve-vosk-model"
          MODEL_DIR="$(find "$RUNNER_TEMP/eve-vosk-model" -type f -path '*/am/final.mdl' -printf '%h\n' | sed 's#/am$##' | head -n1)"
          test -n "$MODEL_DIR"
          echo "VOSK_MODEL_DIR=$MODEL_DIR" >> "$GITHUB_ENV"
      - name: Prepare Arabic read-speech targets and separate evaluation sets
        run: |
          python .github/scripts/prepare-eve-bilingual-teacher-corpus.py \
            --model "$VOSK_MODEL_DIR" \
            --out "$RUNNER_TEMP/eve-bilingual-teacher-corpus" \
            --train-limit "${{ inputs.train_limit || '240' }}" \
            --eval-limit "${{ inputs.eval_limit || '80' }}" \
            --max-wer "${{ inputs.max_wer || '0.55' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: EVE-Bilingual-Arabic-Teacher-Corpus
          path: ${{ runner.temp }}/eve-bilingual-teacher-corpus/
          if-no-files-found: error
          retention-days: 14
