name: EVE Android Build

concurrency:
  group: eve-android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'eve-project/**'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/emulator-smoke-test.yml'
      - '.github/workflows/eve-deep-verification.yml'
      - '.github/scripts/emulator-smoke-test.sh'
      - '.github/scripts/run-deep-face-test.sh'

permissions:
  contents: read

jobs:
  build:
    name: Build and unit-test the EVE app
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             "https://services.gradle.org/distributions/gradle-8.9-bin.zip"             --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"

      - name: Download and pin offline facial-expression model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/eve_emotion_model.tflite"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/EnricoZanetti/moodstream/af59e5cdbd45936051a27e694b160996526f11bb/models/emotion_model.tflite" \
            --output "$MODEL"
          EXPECTED="508da02d7ebad42e160ad4df0e946e2a16bf4c66"
          ACTUAL="$(git hash-object "$MODEL")"
          echo "FER model Git blob hash: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: emotion model hash changed; refusing an unreviewed model."
            exit 1
          fi
          ls -lh "$MODEL"

      - name: Run logic tests and build debug APK
        run: |
          "$RUNNER_TEMP/gradle-8.9/bin/gradle"             --no-daemon --stacktrace -p eve-project             testDebugUnitTest assembleDebug


      - name: Verify APK signatures for installer compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="eve-project/app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          OUTPUT="$("$APKSIGNER" verify --verbose "$APK")"
          printf '%s\n' "$OUTPUT"
          grep -Fq 'Verified using v1 scheme (JAR signing): true' <<< "$OUTPUT"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$OUTPUT"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$OUTPUT"

      - name: Upload unit-test XML and HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Unit-Test-Reports
          path: |
            eve-project/app/build/reports/tests/testDebugUnitTest/**
            eve-project/app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WALL-E-APK
          path: eve-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
