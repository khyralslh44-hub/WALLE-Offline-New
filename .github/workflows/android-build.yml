# Rebuild verification requested 2026-10-26; build behavior is unchanged.
name: EVE Android Build

concurrency:
  group: eve-android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'eve-project/**'
      - '.github/scripts/fetch-moonshine-tiny-ar.sh'
      - '.github/scripts/create-moonshine-tokens.py'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/emulator-smoke-test.yml'
      - '.github/workflows/eve-deep-verification.yml'
      - '.github/scripts/emulator-smoke-test.sh'
      - '.github/scripts/run-deep-face-test.sh'
      - '.github/scripts/fetch-arabic-vosk-model.sh'
      - '.github/scripts/run-local-llm-test.sh'
      - 'EVE_COMPACT_ARABIC_BRAIN.md'
      - '.github/workflows/eve-local-llm-verification.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build and unit-test the EVE app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             "https://services.gradle.org/distributions/gradle-8.9-bin.zip"             --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"

      - name: Download and pin offline facial-expression model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/eve_emotion_model.tflite"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/EnricoZanetti/moodstream/af59e5cdbd45936051a27e694b160996526f11bb/models/emotion_model.tflite" \
            --output "$MODEL"
          EXPECTED="508da02d7ebad42e160ad4df0e946e2a16bf4c66"
          ACTUAL="$(git hash-object "$MODEL")"
          echo "FER model Git blob hash: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: emotion model hash changed; refusing an unreviewed model."
            exit 1
          fi
          ls -lh "$MODEL"

      - name: Download and pin offline COCO object detector
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/efficientdet_lite0.tflite"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite" \
            --output "$MODEL"
          ACTUAL_SHA256="$(sha256sum "$MODEL" | awk '{print $1}')"
          ACTUAL_BYTES="$(stat -c '%s' "$MODEL")"
          echo "EfficientDet-Lite0 INT8 SHA-256: $ACTUAL_SHA256"
          echo "EfficientDet-Lite0 INT8 bytes: $ACTUAL_BYTES"
          if [ "$ACTUAL_BYTES" -lt 3500000 ] || [ "$ACTUAL_BYTES" -gt 5500000 ]; then
            echo "FAIL: INT8 object detector size is outside the expected 3.5–5.5 MB range."
            exit 1
          fi
          sha256sum "$MODEL" | tee "$RUNNER_TEMP/object-detector-sha256.txt"
          echo "PASS: compact official EfficientDet-Lite0 INT8 model downloaded."

      - name: Download broad offline ImageNet image classifier
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/efficientnet_lite0_int8.tflite"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            "https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0/int8/latest/efficientnet_lite0.tflite" \
            --output "$MODEL"
          BYTES="$(stat -c '%s' "$MODEL")"
          SHA256="$(sha256sum "$MODEL" | awk '{print $1}')"
          EXPECTED_SHA256="bc2ffe19c1118de0c0c2a9088992da5589722656e0fba81421385300a4a34b16"
          EXPECTED_BYTES=5434517
          echo "EfficientNet-Lite0 ImageNet SHA-256: $SHA256"
          echo "EfficientNet-Lite0 ImageNet bytes: $BYTES"
          if [ "$SHA256" != "$EXPECTED_SHA256" ] || [ "$BYTES" -ne "$EXPECTED_BYTES" ]; then
            echo "FAIL: ImageNet classifier model differs from the reviewed pinned model."
            exit 1
          fi
          sha256sum "$MODEL" | tee "$RUNNER_TEMP/imagenet-classifier-sha256.txt"
          echo "PASS: broad offline ImageNet classifier downloaded for local inference."
 
      - name: Download and pin offline hand-gesture model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/gesture_recognizer.task"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/aa-del9/silent-speech/65249bd95a6f3467fbe67e175058f12cadbb9715/client/app/src/main/assets/gesture_recognizer.task" \
            --output "$MODEL"
          EXPECTED="33524de2b1595e3b755e50c0deaabd602af30085"
          ACTUAL="$(git hash-object "$MODEL")"
          echo "Hand gesture model Git blob hash: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: gesture model hash changed; refusing an unreviewed model."
            exit 1
          fi
          ls -lh "$MODEL"

      - name: Download and pin offline pose landmarker for human-motion reasoning
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/pose_landmarker_lite.task"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 180 \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" \
            --output "$MODEL"
          EXPECTED_SHA256="59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a"
          ACTUAL_SHA256="$(sha256sum "$MODEL" | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "FAIL: pose landmarker does not match the pinned Lite model."
            exit 1
          fi
          echo "PASS: offline Pose Landmarker Lite SHA-256=$ACTUAL_SHA256 bytes=$(stat -c '%s' "$MODEL")"

      - name: Download and pin offline MobileFaceNet identity model
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="eve-project/app/src/main/assets"
          MODEL="$ASSETS/MobileFaceNet.tflite"
          LICENSE="$ASSETS/mobilefacenet_model_license.txt"
          mkdir -p "$ASSETS"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "https://raw.githubusercontent.com/syaringan357/Android-MobileFaceNet-MTCNN-FaceAntiSpoofing/d635649e711f5e16e6cd3dc06cbb329cd8d1d3b7/app/src/main/assets/MobileFaceNet.tflite" --output "$MODEL"
          EXPECTED="3249c511be86366d5d0a137dc6f4af321af28678"
          ACTUAL="$(git hash-object "$MODEL")"
          echo "MobileFaceNet Git blob hash: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: MobileFaceNet model hash changed; refusing an unreviewed model."
            exit 1
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "https://raw.githubusercontent.com/syaringan357/Android-MobileFaceNet-MTCNN-FaceAntiSpoofing/d635649e711f5e16e6cd3dc06cbb329cd8d1d3b7/LICENSE" --output "$LICENSE"
          grep -Fq "MIT License" "$LICENSE"
          ls -lh "$MODEL" "$LICENSE"
          echo "PASS: pinned offline face-identity model and its license are ready."
      - name: Add the pinned ARM-compatible sherpa-onnx runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eve-project/app/libs
          AAR="eve-project/app/libs/sherpa-onnx-2.0.1.aar"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" \
            --output "$AAR"
          ACTUAL="$(sha256sum "$AAR" | awk '{print $1}')"
          EXPECTED="a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7"
          test "$ACTUAL" = "$EXPECTED"
          echo "PASS: sherpa-onnx 2.0.1 AAR sha256=$ACTUAL"

      - name: Download compact fully offline Moonshine Tiny Arabic model
        shell: bash
        run: bash .github/scripts/fetch-moonshine-tiny-ar.sh

      - name: Download and verify offline MediaPipe pose model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/pose_landmarker_lite.task"
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task" \
            --output "$MODEL"
          test -s "$MODEL"
          # The task bundle must be present before Gradle packages app assets.
          file "$MODEL"
          echo "Pose model downloaded: $(wc -c < "$MODEL") bytes"

      - name: Train EVE compact Arabic student model
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/train_eve_student.py
          test -s eve-project/app/src/main/java/com/eve/robot/EveDistilledArabicStudent.kt

      - name: Run logic tests and build debug APK
        run: |
          "$RUNNER_TEMP/gradle-8.9/bin/gradle"             --no-daemon --stacktrace -p eve-project             testDebugUnitTest assembleDebug assembleRelease


      - name: Verify LiteRT-LM integration and keep model weights outside APK
        shell: bash
        run: |
          set -euo pipefail
          for APK in \
            "eve-project/app/build/outputs/apk/debug/app-debug.apk" \
            "eve-project/app/build/outputs/apk/release/app-release.apk"; do
            test -s "$APK"
            if unzip -Z1 "$APK" | grep -E "[.]litertlm|[.]gguf|[.]safetensors|libllama(_jni)?[.]so"; then
              echo "FAIL: model weights or obsolete llama.cpp libraries are bundled in $APK."
              exit 1
            fi
            if ! unzip -p "$APK" "classes*.dex" | strings | grep -F "EveLiteRtLanguageModel" > /dev/null; then
              echo "FAIL: EVE LiteRT-LM integration class is missing from $APK."
              exit 1
            fi
            echo "PASS: LiteRT-LM integration present; Qwen3 weights remain external to $APK."
          done
      - name: Verify compact offline Arabic speech model is packaged in both APKs
        shell: bash
        run: |
          set -euo pipefail
          for APK in \
            "eve-project/app/build/outputs/apk/debug/app-debug.apk" \
            "eve-project/app/build/outputs/apk/release/app-release.apk"; do
            test -s "$APK"
            ENTRIES="$RUNNER_TEMP/speech-entries.txt"
            unzip -Z1 "$APK" > "$ENTRIES"
            for ASSET in \
              eve_moonshine_ar_tokens.txt \
              moonshine_ai_community_license.txt \
              moonshine_ai_notice.txt; do
              grep -Fxq "assets/$ASSET" "$ENTRIES"
              PACKAGED="$(unzip -p "$APK" "assets/$ASSET" | sha256sum | awk '{print $1}')"
              SOURCE="$(sha256sum "eve-project/app/src/main/assets/$ASSET" | awk '{print $1}')"
              test "$PACKAGED" = "$SOURCE"
              echo "PASS: $APK contains $ASSET sha256=$PACKAGED"
            done
          done
          for APK in \
            "eve-project/app/build/outputs/apk/debug/app-debug.apk" \
            "eve-project/app/build/outputs/apk/release/app-release.apk"; do
            if unzip -Z1 "$APK" | grep -E 'eve_moonshine_ar_(encoder|decoder)_int8[.]onnx'; then
              echo "FAIL: large Arabic ONNX weights must remain outside the installer package."
              exit 1
            fi
            echo "PASS: Arabic ONNX weights are external to $APK and SHA-256 verified by EVE on first use."
          done

      - name: Report final release APK size
        shell: bash
        run: |
          set -euo pipefail
          APK="eve-project/app/build/outputs/apk/release/app-release.apk"
          BYTES="$(stat -c '%s' "$APK")"
          MIB="$(awk -v bytes="$BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')"
          echo "EVE Redmi 12 release APK size: $BYTES bytes ($MIB MiB)"
          echo "Target: 80 MiB maximum; further distillation/asset reduction may still be required."

      - name: Verify offline vision models are packaged in both APKs
        shell: bash
        run: |
          set -euo pipefail
          ASSET_NAME="efficientnet_lite0_int8.tflite"
          for APK in \
            "eve-project/app/build/outputs/apk/debug/app-debug.apk" \
            "eve-project/app/build/outputs/apk/release/app-release.apk"; do
            test -s "$APK"
            unzip -Z1 "$APK" > "$RUNNER_TEMP/vision-apk-entries.txt"
            if ! grep -Fxq "assets/$ASSET_NAME" "$RUNNER_TEMP/vision-apk-entries.txt"; then
              echo "FAIL: broad offline image classifier is missing from $APK"
              exit 1
            fi
            PACKAGED_SHA256="$(unzip -p "$APK" "assets/$ASSET_NAME" | sha256sum | awk '{print $1}')"
            SOURCE_SHA256="$(sha256sum "eve-project/app/src/main/assets/$ASSET_NAME" | awk '{print $1}')"
            if [ "$PACKAGED_SHA256" != "$SOURCE_SHA256" ]; then
              echo "FAIL: packaged ImageNet model hash differs from downloaded model."
              exit 1
            fi
            echo "PASS: $APK contains efficientnet_lite0_int8.tflite SHA-256=$PACKAGED_SHA256"
            POSE_NAME="pose_landmarker_lite.task"
            POSE_SOURCE="eve-project/app/src/main/assets/$POSE_NAME"
            test -s "$POSE_SOURCE"
            test "$(sha256sum "$POSE_SOURCE" | awk '{print $1}')" = "59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a"
            if ! grep -Fxq "assets/$POSE_NAME" "$RUNNER_TEMP/vision-apk-entries.txt"; then
              echo "FAIL: offline pose model is missing from $APK"
              exit 1
            fi
            POSE_PACKAGED_SHA256="$(unzip -p "$APK" "assets/$POSE_NAME" | sha256sum | awk '{print $1}')"
            POSE_SOURCE_SHA256="$(sha256sum "$POSE_SOURCE" | awk '{print $1}')"
            if [ "$POSE_PACKAGED_SHA256" != "$POSE_SOURCE_SHA256" ]; then
              echo "FAIL: packaged pose model hash differs from the pinned source model."
              exit 1
            fi
            echo "PASS: $APK contains $POSE_NAME SHA-256=$POSE_PACKAGED_SHA256"
          done

      - name: Verify pinned MobileFaceNet model and license are packaged in both APKs
        shell: bash
        run: |
          set -euo pipefail
          MODEL="eve-project/app/src/main/assets/MobileFaceNet.tflite"
          LICENSE="eve-project/app/src/main/assets/mobilefacenet_model_license.txt"
          EXPECTED="3249c511be86366d5d0a137dc6f4af321af28678"
          test -s "$MODEL"
          test -s "$LICENSE"
          test "$(git hash-object "$MODEL")" = "$EXPECTED"
          grep -Fq "MIT License" "$LICENSE"
          for APK in \
            "eve-project/app/build/outputs/apk/debug/app-debug.apk" \
            "eve-project/app/build/outputs/apk/release/app-release.apk"; do
            test -s "$APK"
            unzip -Z1 "$APK" | grep -Fxq "assets/MobileFaceNet.tflite"
            unzip -Z1 "$APK" | grep -Fxq "assets/mobilefacenet_model_license.txt"
            PACKAGED="$(unzip -p "$APK" assets/MobileFaceNet.tflite | git hash-object --stdin)"
            if [ "$PACKAGED" != "$EXPECTED" ]; then
              echo "FAIL: MobileFaceNet model in $APK does not match the pinned model."
              exit 1
            fi
            echo "PASS: $APK contains the pinned offline identity model and license."
          done

      - name: Inspect biggest files inside the compact release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="eve-project/app/build/outputs/apk/release/app-release.apk"
          unzip -lv "$APK" | awk 'NR>3 && $4 ~ /^[0-9]+$/ {print $4, $NF}' | sort -nr | head -n 35

      - name: Verify APK signatures for installer compatibility
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          for APK in \
            "eve-project/app/build/outputs/apk/debug/app-debug.apk" \
            "eve-project/app/build/outputs/apk/release/app-release.apk"; do
            test -s "$APK"
            OUTPUT="$("$APKSIGNER" verify --verbose "$APK")"
            printf '%s\n' "$OUTPUT"
            grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$OUTPUT"
            grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$OUTPUT"
          done

      - name: Upload unit-test XML and HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Unit-Test-Reports
          path: |
            eve-project/app/build/reports/tests/testDebugUnitTest/**
            eve-project/app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WALL-E-APK
          path: eve-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload compact Redmi 12 ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: WALL-E-APK-Redmi12
          path: eve-project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish direct-install APK release
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eve-build-${{ github.run_number }}
          name: EVE Android APK build ${{ github.run_number }}
          body: |
            Direct-install APK built by GitHub Actions.
            Source commit: ${{ github.sha }}
            EVE Tiny Arabic Brain, camera labeling, facial-expression inference, gesture recognition, and behavior logic run locally on-device.
          files: eve-project/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
