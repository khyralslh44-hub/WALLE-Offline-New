name: WALL-E Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'WALLE_Offline_Android_Fixed (2).zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl openjdk-17-jdk
      - name: Extract project
        run: |
          mkdir -p project
          unzip -o 'WALLE_Offline_Android_Fixed (2).zip' -d project
          echo '--- Align app JVM targets to Java 1.8 for this test build ---'
          APP_GRADLE="$(find "$GITHUB_WORKSPACE/project" -path '*/app/build.gradle' -print -quit)"
          test -n "$APP_GRADLE"
          cat >> "$APP_GRADLE" <<'EOF'

          // Temporary CI compatibility override: keep Java and Kotlin targets aligned.
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }
          EOF
          echo '--- Effective JVM target declarations ---'
          grep -n 'jvmTarget\|VERSION_1_8\|sourceCompatibility\|targetCompatibility' "$APP_GRADLE" || true
      - name: Build APK
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          SETTINGS="$(find "$GITHUB_WORKSPACE/project" -name settings.gradle -print -quit)"
          test -n "$SETTINGS"
          cd "$(dirname "$SETTINGS")"
          /tmp/gradle-8.7/bin/gradle assembleDebug -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: WALL-E-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
