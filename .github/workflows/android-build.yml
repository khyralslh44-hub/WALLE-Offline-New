name: EVE Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'eve-project/**'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/emulator-smoke-test.yml'
      - '.github/scripts/emulator-smoke-test.sh'

permissions:
  contents: read

jobs:
  build:
    name: Build and unit-test the EVE app
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             "https://services.gradle.org/distributions/gradle-8.9-bin.zip"             --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"

      - name: Run logic tests and build debug APK
        run: |
          "$RUNNER_TEMP/gradle-8.9/bin/gradle"             --no-daemon --stacktrace -p eve-project             testDebugUnitTest assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WALL-E-APK
          path: eve-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
