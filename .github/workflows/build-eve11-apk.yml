name: Build EVE Android 11 APK

on:
  push:
    branches:
      - build/eve-android-11-upload
    paths:
      - "eve-android (11).zip"
      - ".github/workflows/build-eve11-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout version 11 branch
        uses: actions/checkout@v4
        with:
          ref: build/eve-android-11-upload

      - name: Verify and extract original version 11 archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="eve-android (11).zip"
          test -s "$ARCHIVE"
          unzip -t "$ARCHIVE"
          mkdir -p source
          unzip -q "$ARCHIVE" -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts
          echo "Source archive SHA-256:"
          sha256sum "$ARCHIVE"
          echo "Source files: $(unzip -Z1 "$ARCHIVE" | wc -l)"

      - name: Inspect offline speech integration before size optimization
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Speech-related source files ==="
          find source/app/src/main -type f | grep -Ei 'vosk|speech|voice|audio' || true
          echo "=== Vosk and Android speech call sites ==="
          grep -R -n -E 'VoskSpeech|org\.vosk|SpeechRecognizer|RecognizerIntent|vosk/model' source/app/src/main/java source/app/src/main/AndroidManifest.xml source/app/build.gradle.kts || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply Kotlin receiver qualification in build copy only
        shell: bash
        run: |
          set -euo pipefail
          FILE="source/app/src/main/java/com/eve/companion/MainActivity.kt"
          if grep -q 'voice.factor(style)' "$FILE" && ! grep -q 'this@MainActivity.voice.factor(style)' "$FILE"; then
            sed -i 's/voice\.factor(style)/this@MainActivity.voice.factor(style)/' "$FILE"
            echo "Applied compile-only Kotlin receiver fix to extracted build copy."
          else
            echo "No receiver fix needed."
          fi

      - name: Download five on-device vision models
        shell: bash
        run: |
          set -euo pipefail
          B="https://storage.googleapis.com/mediapipe-models"
          D="source/app/src/main/assets/models"
          mkdir -p "$D"
          curl -fL "$B/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite" -o "$D/objects.tflite"
          curl -fL "$B/face_landmarker/face_landmarker/float16/1/face_landmarker.task" -o "$D/face.task"
          curl -fL "$B/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task" -o "$D/gesture.task"
          curl -fL "$B/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite" -o "$D/embed.tflite"
          curl -fL "$B/image_classifier/efficientnet_lite0/float32/1/efficientnet_lite0.tflite" -o "$D/classify.tflite"
          for f in objects.tflite face.task gesture.task embed.tflite classify.tflite; do
            test -s "$D/$f"
            sha256sum "$D/$f"
          done
          du -sh "$D"

      - name: Download embedded Arabic Vosk model (optional, as specified by version 11)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          MODEL_URL="${{ vars.VOSK_MODEL_URL || 'https://alphacephei.com/vosk/models/vosk-model-ar-mgb2-0.4.zip' }}"
          curl --fail --location --retry 3 "$MODEL_URL" -o /tmp/vosk-ar.zip
          mkdir -p /tmp/vosk-ar source/app/src/main/assets/vosk
          unzip -q /tmp/vosk-ar.zip -d /tmp/vosk-ar
          MODEL_DIR="$(find /tmp/vosk-ar -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$MODEL_DIR"
          mkdir -p source/app/src/main/assets/vosk/model
          cp -a "$MODEL_DIR"/. source/app/src/main/assets/vosk/model/
          echo "ar-$(date +%s)" > source/app/src/main/assets/vosk/model/uuid
          du -sh source/app/src/main/assets/vosk

      - name: Build debug APK
        working-directory: source
        run: gradle assembleDebug --no-daemon

      - name: Verify APK and packaged assets
        shell: bash
        run: |
          set -euo pipefail
          APK="source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size:"
          ls -lh "$APK"
          echo "Vision assets inside APK:"
          unzip -l "$APK" | grep -E 'assets/models/(objects\.tflite|face\.task|gesture\.task|embed\.tflite|classify\.tflite)'
          echo "Vosk assets inside APK (present only if the optional model download succeeded):"
          unzip -l "$APK" | grep 'assets/vosk/model/' | head -5 || true
          sha256sum "$APK" | tee source/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload EVE 11 APK
        uses: actions/upload-artifact@v4
        with:
          name: EVE-11-APK
          path: |
            source/app/build/outputs/apk/debug/app-debug.apk
            source/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
