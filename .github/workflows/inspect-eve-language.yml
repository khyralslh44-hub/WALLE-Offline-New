name: Temporary inspect EVE embedded language model
on:
  push:
    paths:
      - '.github/workflows/inspect-eve-language.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print model runtime implementation
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("eve-android (7).zip") as z:
              s=z.read("app/src/main/assets/eve.html").decode("utf-8","replace").splitlines()
              for n in [567,568,569,570,571,572,573,574,575,576,577,578,579,580,581,582,583,584,585,586,587,588,589,590,591,592,593,594,595,596,597,598,599,600,601,602,603,604]:
                  if n<=len(s): print(f"LINE {n}:\\n{s[n-1]}\\n")
          PY
