name: Nova Standalone Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'nova-project/**'
      - '.github/workflows/nova-android-build.yml'

permissions:
  contents: read

concurrency:
  group: nova-standalone-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test lightweight Nova app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://services.gradle.org/distributions/gradle-8.9-bin.zip" --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"

      - name: Download pinned offline vision model assets
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="nova-project/app/src/main/assets"
          mkdir -p "$ASSETS"
          curl --fail --location --retry 3 "https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0/float32/1/efficientnet_lite0.tflite" --output "$ASSETS/efficientnet_lite0.tflite"
          curl --fail --location --retry 3 "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite" --output "$ASSETS/efficientdet_lite0.tflite"
          curl --fail --location --retry 3 "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" --output "$ASSETS/pose_landmarker_lite.task"
          curl --fail --location --retry 3 "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" --output "$ASSETS/face_landmarker.task"
          curl --fail --location --retry 3 "https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/mobile_facenet/releases/v0.65.0/mobile_facenet-tflite-float.zip" --output "$RUNNER_TEMP/mobile_facenet.zip"
          # MIT-licensed compact facial-expression model, pinned to an immutable commit.
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/CodeArtisanRiz/FaceEmotion/e9b3557aff430c73eb2cad4517f05b7374e79a9d/app/src/main/assets/simple_classifier.tflite" --output "$ASSETS/simple_classifier.tflite"
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/CodeArtisanRiz/FaceEmotion/e9b3557aff430c73eb2cad4517f05b7374e79a9d/LICENSE" --output "$ASSETS/SIMPLE_CLASSIFIER_LICENSE.txt"
          mkdir -p "$RUNNER_TEMP/mobile_facenet"
          unzip -q "$RUNNER_TEMP/mobile_facenet.zip" -d "$RUNNER_TEMP/mobile_facenet"
          FACE_MODEL="$(find "$RUNNER_TEMP/mobile_facenet" -type f -iname '*.tflite' -print -quit)"
          test -n "$FACE_MODEL"
          cp "$FACE_MODEL" "$ASSETS/mobile_facenet.tflite"
          for model in efficientnet_lite0.tflite efficientdet_lite0.tflite pose_landmarker_lite.task face_landmarker.task mobile_facenet.tflite simple_classifier.tflite SIMPLE_CLASSIFIER_LICENSE.txt; do
            test -s "$ASSETS/$model"
            echo "Bundled model: $model ($(stat -c '%s' "$ASSETS/$model") bytes)"
          done

      - name: Run unit tests and build installable Nova APK
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" -p nova-project --no-daemon testDebugUnitTest assembleDebug
          APK="nova-project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE="$(stat -c '%s' "$APK")"
          echo "Nova APK bytes=$SIZE"
          # Bundled offline vision models and Android runtimes make this APK larger.
          # Keep the guard at 100 MB and retain ABI filters to exclude unused native libraries.
          if [ "$SIZE" -gt 100000000 ]; then
            echo "FAIL: Nova arm64 APK exceeded 100 MB; inspect for accidental universal ABIs."
            exit 1
          fi
          apksigner verify --verbose "$APK"
          if grep -Eq 'uses-permission[^>]+android.permission.INTERNET' nova-project/app/src/main/AndroidManifest.xml; then
            echo "FAIL: Nova must not request internet permission."
            exit 1
          fi
          grep -Fq 'android.permission.CAMERA' nova-project/app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.RECORD_AUDIO' nova-project/app/src/main/AndroidManifest.xml
          grep -Fq 'createOnDeviceSpeechRecognizer' nova-project/app/src/main/java/com/nova/robot/NovaOfflineSpeechInput.kt
          grep -Fq 'isNetworkConnectionRequired' nova-project/app/src/main/java/com/nova/robot/NovaLocalTts.kt
          echo "PASS: no internet permission; camera/microphone are opt-in and speech uses on-device recognition/local Arabic TTS voices."

      - name: Upload Nova installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Standalone-APK
          path: nova-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
